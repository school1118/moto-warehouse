<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستم جامع انبارداری چندشعبه‌ای بنگاه موتور</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
  :root{
    --blue:#2a5298; --navy:#1e3c72; --green:#27ae60; --orange:#e67e22; --red:#c0392b; --purple:#8e44ad;
    --bg:#f0f2f5; --card:#fff; --line:#e6e9ef; --muted:#6b7280;
  }
  html.dark{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --muted:#94a3b8;
  }
  html.dark body{ background:var(--bg); color:#e2e8f0; }
  html.dark .panel, html.dark table, html.dark .toolbar, html.dark .modal, html.dark .branch-bar, html.dark nav{ background:var(--card); color:#e2e8f0; }
  html.dark th{ background:#26334a; color:#cbd5e1; }
  html.dark td{ border-color:var(--line); }
  html.dark tr:hover td{ background:#26334a; }
  html.dark input, html.dark select, html.dark textarea{ background:#0f172a; color:#e2e8f0; border-color:#334155; }
  html.dark .empty, html.dark .info-grid{ color:#94a3b8; }
  html.dark h2, html.dark h3{ color:#93c5fd; }
  html.dark .history-item{ background:#26334a; }
  body { margin:0; background:var(--bg); color:#222; font-size:14px; transition:.2s; }
  header { background:linear-gradient(135deg,#1e3c72,#2a5298); color:#fff; padding:12px 22px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.15); flex-wrap:wrap; gap:10px; }
  header h1 { margin:0; font-size:18px; }
  header .stats { font-size:12px; opacity:.95; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:20px; }
  .head-actions{ display:flex; align-items:center; gap:8px; }
  .head-actions button{ background:rgba(255,255,255,.15); border:none; color:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12px; }
  .head-actions button:hover{ background:rgba(255,255,255,.28); }

  .branch-bar { background:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; border-bottom:2px solid #e0e0e0; flex-wrap:wrap; }
  .branch-bar label { font-weight:700; color:#1e3c72; font-size:13px; }
  .branch-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .branch-tabs button { padding:7px 14px; border:2px solid #ccd; background:#fff; border-radius:20px; cursor:pointer; font-weight:600; font-size:12px; color:#555; transition:.2s; }
  .branch-tabs button:hover { background:#f5f7fa; }
  .branch-tabs button.active { background:#2a5298; color:#fff; border-color:#2a5298; }
  .branch-tabs button.manager { border-color:#e67e22; color:#e67e22; }
  .branch-tabs button.manager.active { background:#e67e22; color:#fff; }
  .branch-tabs button .cnt { background:rgba(0,0,0,.1); padding:1px 6px; border-radius:10px; font-size:10px; margin-right:4px; }
  .branch-tabs button.active .cnt { background:rgba(255,255,255,.25); }

  nav { background:#fff; display:flex; flex-wrap:wrap; border-bottom:2px solid #e0e0e0; padding:0 12px; position:sticky; top:0; z-index:10; overflow-x:auto; }
  nav button { background:none; border:none; padding:13px 14px; cursor:pointer; font-size:13px; font-weight:600; color:#555; border-bottom:3px solid transparent; transition:.2s; white-space:nowrap; }
  nav button:hover { background:#f5f7fa; }
  nav button.active { color:#2a5298; border-bottom-color:#2a5298; }
  main { padding:18px; max-width:1500px; margin:auto; }
  .panel { display:none; background:#fff; border-radius:10px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .panel.active { display:block; }
  h2 { margin-top:0; color:#1e3c72; border-bottom:2px solid #eef; padding-bottom:10px; font-size:18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  h2 .badge-branch { background:#eef; color:#2a5298; font-size:12px; padding:5px 12px; border-radius:20px; font-weight:600; }
  h3 { color:#2a5298; margin-top:22px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  label { font-size:12px; font-weight:600; color:#444; }
  html.dark label{ color:#cbd5e1; }
  input, select, textarea { padding:8px 10px; border:1px solid #ccd; border-radius:6px; font-size:13px; font-family:inherit; background:#fff; width:100%; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#2a5298; box-shadow:0 0 0 3px rgba(42,82,152,.12); }
  input[readonly] { background:#f5f7fa; }
  input.err, select.err, textarea.err { border-color:#c0392b !important; box-shadow:0 0 0 3px rgba(192,57,43,.15) !important; }
  button.btn { background:#2a5298; color:#fff; border:none; padding:9px 18px; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px; margin-top:10px; transition:.2s; }
  button.btn:hover { background:#1e3c72; }
  button.btn:disabled{ background:#9aa5b5; cursor:not-allowed; }
  button.btn.danger { background:#c0392b; } button.btn.danger:hover { background:#96281b; }
  button.btn.success { background:#27ae60; } button.btn.success:hover { background:#1e8449; }
  button.btn.warn { background:#e67e22; } button.btn.warn:hover { background:#ca6f1e; }
  button.btn.gray { background:#888; } button.btn.gray:hover { background:#666; }
  button.btn.purple { background:#8e44ad; } button.btn.purple:hover { background:#6c3483; }
  button.btn.small { padding:4px 9px; font-size:11px; margin:0 2px; }
  .actions { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:4px; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:12px; background:#fff; }
  th, td { padding:8px 7px; border-bottom:1px solid #eee; text-align:right; }
  th { background:#f4f6fa; color:#1e3c72; font-weight:700; white-space:nowrap; font-size:11px; cursor:pointer; user-select:none; }
  th.no-sort{ cursor:default; }
  tr:hover td { background:#fafbfd; }
  .badge { display:inline-block; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700; white-space:nowrap; }
  .b-in { background:#d4edda; color:#155724; }
  .b-sale { background:#cce5ff; color:#004085; }
  .b-out { background:#f8d7da; color:#721c24; }
  .b-return { background:#d1ecf1; color:#0c5460; }
  .b-transfer { background:#fff3cd; color:#856404; }
  .b-cash { background:#d4edda; color:#155724; }
  .b-check { background:#fff3cd; color:#856404; }
  .b-inst { background:#f8d7da; color:#721c24; }
  .b-trust { background:#e2d5f8; color:#4a1e82; }
  .b-low { background:#fde2e2; color:#a11; }
  .stat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .stat-card { background:linear-gradient(135deg,#2a5298,#1e3c72); color:#fff; padding:14px; border-radius:10px; text-align:center; cursor:default; }
  .stat-card.click{cursor:pointer;}
  .stat-card.green { background:linear-gradient(135deg,#27ae60,#1e8449); }
  .stat-card.orange { background:linear-gradient(135deg,#e67e22,#ca6f1e); }
  .stat-card.red { background:linear-gradient(135deg,#c0392b,#96281b); }
  .stat-card.purple { background:linear-gradient(135deg,#8e44ad,#6c3483); }
  .stat-card .num { font-size:22px; font-weight:800; }
  .stat-card .lbl { font-size:11px; opacity:.9; margin-top:4px; }
  .empty { text-align:center; color:#999; padding:28px; font-style:italic; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:12px; background:#f8fafd; padding:12px; border-radius:8px; }
  .toolbar .field { min-width:140px; }
  .toolbar .field.search { flex:1; min-width:220px; }
  .toolbar .field.search input { border:2px solid #2a5298; background:#fff; font-weight:600; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; justify-content:center; align-items:center; z-index:100; padding:10px; }
  .modal-back.active { display:flex; }
  .modal { background:#fff; border-radius:10px; padding:20px; max-width:680px; width:100%; max-height:90vh; overflow:auto; }
  .modal h3 { margin-top:0; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120%); background:#333; color:#fff; padding:12px 22px; border-radius:8px; transition:.3s; z-index:200; font-size:13px; max-width:90vw; text-align:center; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.ok { background:#27ae60; } .toast.err { background:#c0392b; } .toast.warn{ background:#e67e22; }

  .dp-wrap { position:relative; }
  .dp-input { cursor:pointer; background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%232a5298' viewBox='0 0 16 16'><path d='M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z'/></svg>") no-repeat left 8px center; padding-left:32px; }
  html.dark .dp-input{ background-color:#0f172a; }
  .dp-pop { position:absolute; top:100%; right:0; z-index:50; background:#fff; border:1px solid #ccd; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.15); padding:10px; display:none; width:280px; margin-top:4px; }
  html.dark .dp-pop{ background:#1e293b; border-color:#334155; }
  .dp-pop.active { display:block; }
  .dp-selects { display:grid; grid-template-columns:1fr 1.4fr 1.1fr; gap:4px; margin-bottom:8px; }
  .dp-selects select { padding:5px 3px; border:1px solid #ccd; border-radius:6px; font-size:12px; background:#fff; cursor:pointer; }
  html.dark .dp-selects select { background:#0f172a; color:#e2e8f0; border-color:#334155; }
  .dp-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:700; }
  .dp-head button { background:#eef; border:none; border-radius:4px; cursor:pointer; padding:4px 10px; font-size:14px; }
  .dp-head button:hover { background:#dde; }
  .dp-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .dp-grid .dow { text-align:center; font-size:10px; color:#888; padding:4px 0; font-weight:700; }
  .dp-grid .day { text-align:center; padding:6px 0; border-radius:4px; cursor:pointer; font-size:12px; }
  .dp-grid .day:hover { background:#eef; }
  .dp-grid .day.today { background:#ffe7b3; }
  .dp-grid .day.sel { background:#2a5298; color:#fff; }
  .dp-grid .day.empty { color:#ccc; cursor:default; }
  .dp-grid .day.empty:hover { background:transparent; }
  .dp-foot { text-align:center; margin-top:8px; font-size:11px; color:#888; }

  .chip { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:20px; font-size:11px; font-weight:600; background:#eef; color:#2a5298; margin:2px; }
  .history-item { border-right:3px solid #2a5298; padding:10px 14px; margin:8px 0; background:#f8fafd; border-radius:0 6px 6px 0; font-size:12px; line-height:1.9; }
  .history-item .meta { color:#555; font-size:11px; margin-top:4px; border-top:1px dashed #ccd; padding-top:6px; }
  .history-item .row-kv { display:inline-block; margin-left:14px; }
  .history-item .row-kv b { color:#1e3c72; }
  .info-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin:10px 0; padding:10px; background:#f8fafd; border-radius:6px; font-size:12px; }
  .info-grid b { color:#1e3c72; }
  .helper{ font-size:11px; color:var(--muted); }
  .alert{ padding:10px 14px; border-radius:8px; font-size:12px; margin:10px 0; }
  .alert.warn{ background:#fff8e1; border-right:4px solid #e67e22; color:#7a4a00; }
  .alert.info{ background:#e8f1ff; border-right:4px solid #2a5298; color:#1e3c72; }
  .alert.red{ background:#fdecea; border-right:4px solid #c0392b; color:#8a1f1f; }
  .pos{ color:#198038; font-weight:700; } .neg{ color:#c0392b; font-weight:700; }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  .seg button{ border:1px solid #ccd; background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:600; font-size:12px; }
  .seg button.active{ background:#2a5298; color:#fff; border-color:#2a5298; }
  .bar{ height:9px; border-radius:6px; background:#e6e9ef; overflow:hidden; }
  .bar span{ display:block; height:100%; background:linear-gradient(90deg,#27ae60,#2a5298); }
  .row-flex{ display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  .row-flex > .field{ flex:1; min-width:150px; }
  .list-row{ display:flex; justify-content:space-between; gap:8px; padding:8px 10px; border-bottom:1px dashed var(--line); font-size:12px; align-items:center; }
  .tabs-sub{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin:10px 0; flex-wrap:wrap; }
  .tabs-sub button{ background:none; border:none; padding:8px 12px; cursor:pointer; font-weight:600; font-size:12px; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs-sub button.active{ color:#2a5298; border-bottom-color:#2a5298; }
  .kpi-mini{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .kpi-mini div{ background:#f8fafd; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; font-size:12px; }
  html.dark .kpi-mini div{ background:#26334a; }
  .kpi-mini b{ display:block; font-size:16px; color:#2a5298; }
  html.dark .kpi-mini b{ color:#93c5fd; }
  @media(max-width:640px){ nav button{padding:9px 8px; font-size:11px;} main{padding:8px;} th,td{font-size:10px;padding:5px 3px;} .history-item .row-kv{display:block;} }
  /* صفحه ورود */
  .login-screen{ position:fixed; inset:0; background:linear-gradient(135deg,#1e3c72,#2a5298); display:flex; align-items:center; justify-content:center; z-index:500; padding:16px; }
  .login-screen.hidden{ display:none; }
  .login-card{ background:#fff; border-radius:16px; padding:28px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  html.dark .login-card{ background:#1e293b; color:#e2e8f0; }
  .login-card h1{ margin:0 0 6px; font-size:20px; color:#1e3c72; text-align:center; }
  html.dark .login-card h1{ color:#93c5fd; }
  .login-sub{ text-align:center; font-size:12px; color:#6b7280; margin:0 0 18px; }
  .login-card .field{ margin-bottom:12px; }
  .login-err{ color:#c0392b; font-size:12px; min-height:18px; margin-top:8px; text-align:center; }
  .badge-role{ background:rgba(255,255,255,.15); }
  #syncBadge.online{ background:rgba(39,174,96,.35); }
  #syncBadge.offline{ background:rgba(192,57,43,.35); }
  .pager{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; padding:12px 4px 4px; justify-content:center; }
  .pg-btn{ min-width:34px; height:34px; border:1px solid #cbd5e1; background:#fff; border-radius:8px;
    cursor:pointer; font-family:inherit; font-size:13px; color:#334155; padding:0 8px; }
  .pg-btn:hover:not(:disabled){ background:#eef2ff; border-color:#818cf8; }
  .pg-btn.act{ background:#4f46e5; color:#fff; border-color:#4f46e5; font-weight:bold; }
  .pg-btn:disabled{ opacity:.4; cursor:default; }
  .pg-info{ font-size:12.5px; color:#64748b; margin:0 8px; }
  .pg-size{ height:34px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:12.5px; padding:0 6px; background:#fff; color:#334155; }
  html.dark .pg-btn{ background:#1e293b; border-color:#475569; color:#cbd5e1; }
  html.dark .pg-btn.act{ background:#4f46e5; color:#fff; }
  html.dark .pg-size{ background:#1e293b; border-color:#475569; color:#cbd5e1; }
  html.dark .pg-info{ color:#94a3b8; }
  @media print{ .login-screen{ display:none !important; } }
  @media print{
    header, .branch-bar, nav, .toolbar, .actions, .no-print{ display:none !important; }
    body{ background:#fff; }
    .panel{ display:block !important; box-shadow:none; }
    .panel:not(.active){ display:none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>🏍️ سیستم جامع انبارداری چندشعبه‌ای بنگاه موتور</h1>
  <div class="head-actions">
    <span class="stats" id="headerStats">در حال بارگذاری...</span>
    <span class="stats" id="syncBadge" title="وضعیت اتصال زنده">⚪ آفلاین</span>
    <span class="stats" id="userBadge">مهمان</span>
    <button onclick="toggleTheme()" title="حالت شب/روز">🌓 <span id="themeLbl">روز</span></button>
    <button onclick="openAccountMenu()" title="حساب کاربری">👤 حساب</button>
    <button onclick="openShortcuts()" title="میان‌برهای صفحه‌کلید">⌨️ راهنما</button>
  </div>
</header>

<!-- صفحه ورود -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>🏍️ انبارداری چندشعبه‌ای</h1>
    <p class="login-sub" id="loginSub">برای ورود، نام کاربری و رمز عبور خود را وارد کنید</p>
    <div id="loginForm">
      <div class="field"><label>نام کاربری</label><input id="login_user" autocomplete="username" placeholder="مثلا manager"></div>
      <div class="field"><label>رمز عبور</label><input id="login_pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div id="loginErr" class="login-err"></div>
      <button class="btn success" style="width:100%;margin-top:14px;" onclick="doLogin()">🔓 ورود</button>
      <div style="text-align:center;margin-top:10px;">
        <a href="#" onclick="openForgotPassword();return false;" style="color:#2a5298;font-size:13px;">رمز عبور را فراموش کرده‌اید؟</a>
      </div>
      <div id="setupBlock" style="display:none;margin-top:16px;border-top:1px dashed #ccd;padding-top:14px;">
        <p class="helper">اولین بار است؟ مدیر سیستم را بسازید.</p>
        <div class="field"><label>نام کاربری مدیر</label><input id="setup_user" placeholder="manager"></div>
        <div class="field"><label>رمز عبور مدیر (حداقل ۶ کاراکتر)</label><input id="setup_pass" type="password"></div>
        <div class="field"><label>تکرار رمز عبور</label><input id="setup_pass2" type="password"></div>
        <button class="btn" style="width:100%;margin-top:12px;" onclick="doSetupManager()">🛡️ ساخت مدیر و شروع</button>
      </div>
    </div>
  </div>
</div>

<div class="branch-bar">
  <label>🏢 شعبه فعال:</label>
  <div class="branch-tabs" id="branchTabs"></div>
</div>

<nav id="mainNav">
  <button class="active" data-tab="dash">📊 داشبورد</button>
  <button data-tab="in">📥 ورود کالا</button>
  <button data-tab="out">📤 خروج کالا</button>
  <button data-tab="cycle">🔄 چرخه موتورها</button>
  <button data-tab="inv">📦 موجودی</button>
  <button data-tab="kardex">📒 کاردکس</button>
  <button data-tab="archive">🗄️ بایگانی</button>
  <button data-tab="report">📈 گزارش شعب</button>
  <button data-tab="log">📝 لاگ فعالیت</button>
  <button data-tab="settings">⚙️ تنظیمات</button>
  <button data-tab="backup">💾 پشتیبان</button>
</nav>

<main id="appMain"></main>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle">تایید</h3>
    <div id="modalMsg"></div>
    <div style="margin-top:16px; text-align:left;" class="no-print">
      <button class="btn gray" onclick="closeModal()">انصراف</button>
      <button class="btn danger" id="modalConfirm">تایید</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script id="app-script">
/* ==========================================================================
   سیستم جامع انبارداری چندشعبه‌ای بنگاه موتور  —  نسخه توسعه‌یافته
   توسعه: CRUD کامل، اعتبارسنجی، اقساط، گارانتی، قطعات، هزینه، CSV، لاگ،
   هشدار موجودی کم، نمودار، جستجوی پیشرفته، مرتب‌سازی، میان‌برهای صفحه‌کلید
   ========================================================================== */

/* ---------- تنظیمات پیش‌فرض ---------- */
const DEFAULT_COMPANIES = [

const ARCHIVE_DAYS = 365;          // بالای یک سال → آرشیو
function itemDeleted(it) { return !!(it && it.deleted); }
function itemArchived(it) { return !!(it && it.archived); }
function activeItems() { return DB.items.filter(i => !itemDeleted(i)); }

/* آیا این موتور باید آرشیو شود؟ (ورود یا آخرین رخداد بیش از یک سال پیش) */
function shouldArchive(it) {
  if (itemDeleted(it) || itemArchived(it)) return false;
  if (it.status === STATUS.IN || it.status === STATUS.RESERVED) return false;
  const ref = it.archivedAt || it.saleDate || it.lastReturn || it.dateIn;
  if (!ref) return false;
  const iso = jalaliToISO(ref);
  if (!iso) return false;
  const days = (Date.now() - new Date(iso).getTime()) / 86400000;
  return days > ARCHIVE_DAYS;
}
/* اجرای آرشیو خودکار — موتورهای فروخته/خارج‌شده بالای یک سال */
function runAutoArchive(showToast) {
  let n = 0;
  for (const it of DB.items) {
    if (shouldArchive(it)) {
      it.archived = true;
      it.archivedAt = new Date().toISOString();
      if (typeof markItemDirty === "function") markItemDirty(it.id);
      n++;
    }
  }
  if (n) {
    DB.settings.lastArchive = new Date().toISOString();
    if (typeof save === "function") save();
    if (showToast) toast(`📦 ${n} موتور بالای یک سال آرشیو شد`);
  } else if (showToast) {
    toast("موردی برای آرشیو وجود ندارد");

  return n;
}

const MAX_PAGES = 100;
function paginate(rows, key) {
  const size = Math.max(10, Math.min(100, Number(uiState.page.size) || 50));
  const total = rows.length;
  let pages = Math.max(1, Math.ceil(total / size));
  pages = Math.min(pages, MAX_PAGES);
  let cur = Math.max(1, Math.min(pages, Number(uiState.page[key]) || 1));
  uiState.page[key] = cur;
  const from = (cur - 1) * size;
  const pageRows = rows.slice(from, from + size);
  const btn = (p, lbl, dis, act) => `<button class="pg-btn${act ? " act" : ""}" ${dis ? "disabled" : ""} onclick="gotoPage('${key}',${p})">${lbl}</button>`;
  let nums = "";
  const start = Math.max(1, cur - 2), end = Math.min(pages, start + 4);
  for (let p = start; p <= end; p++) nums += btn(p, p, false, p === cur);
  const bar = `<div class="pager">
    ${btn(1, "«", cur === 1, false)}
    ${btn(cur - 1, "‹", cur === 1, false)}
    ${nums}
    ${btn(cur + 1, "›", cur === pages, false)}
    ${btn(pages, "»", cur === pages, false)}
    <span class="pg-info">صفحه ${cur} از ${pages} — ${total} مورد</span>
    <select class="pg-size" onchange="setPageSize(this.value)">
      <option value="50" ${size === 50 ? "selected" : ""}>۵۰ در صفحه</option>
      <option value="100" ${size === 100 ? "selected" : ""}>۱۰۰ در صفحه</option>
    </select>
  </div>`;
  return { pageRows, cur, pages, total, from, bar };
}
function gotoPage(key, p) {
  uiState.page[key] = p;
  if (key === "inv") renderInventory();
  else if (key === "cyc") renderCycle();
  else if (key === "archive") renderArchive();
  else if (key === "del") renderDeleted();
  else if (key === "kx" && typeof renderKardex === "function") renderKardex();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function setPageSize(v) {
  uiState.page.size = Number(v) || 50;
  uiState.page.inv = 1; uiState.page.cyc = 1; uiState.page.archive = 1; uiState.page.del = 1; uiState.page.kx = 1;

    if (state !== "low" && state !== "empty" && g.max && count >= g.max) state = "high";
    return { g, count, state };
  });
}

/* ---------- تاریخ شمسی ---------- */
const FA_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const FA_DOW = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
function toJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
    + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function toGregorian(jy, jm, jd) {
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + 78 + jd
    + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal_a = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm;
  for (gm = 0; gm < 13 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
  return [gy, gm, gd];
}
function todayJalali() {
  const d = new Date();
  const [jy, jm, jd] = toJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return `${jy}/${String(jm).padStart(2, "0")}/${String(jd).padStart(2, "0")}`;
}
function jalaliMonthDays(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return ((jy + 12) % 33) % 4 === 1 ? 30 : 29;
}
function jalaliToISO(jStr) {
  if (!jStr || !/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(jStr.trim())) return "";
  const [jy, jm, jd] = jStr.split("/").map(Number);
  const [gy, gm, gd] = toGregorian(jy, jm, jd);
  return `${gy}-${String(gm).padStart(2, "0")}-${String(gd).padStart(2, "0")}`;
}
function addMonthsJalali(jStr, n) {
  if (!/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(jStr || "")) return "";
  let [jy, jm, jd] = jStr.split("/").map(Number);
  jm += n;
  while (jm > 12) { jm -= 12; jy++; }
  while (jm < 1) { jm += 12; jy--; }
  const max = jalaliMonthDays(jy, jm);
  if (jd > max) jd = max;
  return `${jy}/${String(jm).padStart(2, "0")}/${String(jd).padStart(2, "0")}`;
}
function daysUntil(jStr) {
  const iso = jalaliToISO(jStr);
  if (!iso) return null;
  const target = new Date(iso + "T00:00:00");
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}

/* ==========================================================================
   رمزنگاری داده حساس (AES-GCM 256 + PBKDF2 200k)
   طرح امنیتی: یک «کلید داده» تصادفی ساخته می‌شود و همان کلید با دو چیز
   «بسته‌بندی» می‌شود: رمز عبور کاربر  و  عبارت بازیابی.
   مزیت: تغییر رمز، داده‌ها را باطل نمی‌کند و فراموشی رمز با عبارت
   بازیابی قابل جبران است.
   ========================================================================== */
const SENSITIVE_SALE_FIELDS = ["national", "address", "phone", "father", "birth"];
const ENC_PREFIX = "enc:v2:";
const WRAP_PREFIX = "wrap:v1:";
const PBKDF2_ITER = 200000;

function bytesToB64(bytes) { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
function b64ToBytes(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
function randBytes(n) { return crypto.getRandomValues(new Uint8Array(n)); }

async function pbkdf2(password, saltBytes, usage) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: saltBytes, iterations: PBKDF2_ITER, hash: "SHA-256" }, base, 256);
  return new Uint8Array(bits);
}
async function aeadKey(rawBytes) {
  return crypto.subtle.importKey("raw", rawBytes, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
}

/* بسته‌بندی کلید داده با یک رمز/عبارت */
async function wrapDataKey(dataKeyBytes, secret) {
  const salt = randBytes(16);
  const kek = await aeadKey(await pbkdf2(secret, salt, "wrap"));
  const iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, kek, dataKeyBytes);
  return WRAP_PREFIX + bytesToB64(salt) + ":" + bytesToB64(iv) + ":" + bytesToB64(new Uint8Array(ct));
}
async function unwrapDataKey(wrapped, secret) {
  if (typeof wrapped !== "string" || !wrapped.startsWith(WRAP_PREFIX)) throw new Error("bad wrap");
  const [saltB, ivB, ctB] = wrapped.slice(WRAP_PREFIX.length).split(":");
  const kek = await aeadKey(await pbkdf2(secret, b64ToBytes(saltB), "wrap"));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(ivB) }, kek, b64ToBytes(ctB));
  return new Uint8Array(pt);
}

async function encryptStr(plain) {
  if (!sessionKey || plain == null || plain === "") return plain;
  try {
    const iv = randBytes(12);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sessionKey, new TextEncoder().encode(String(plain)));
    return ENC_PREFIX + bytesToB64(iv) + ":" + bytesToB64(new Uint8Array(ct));
  } catch (e) { return plain; }
}
async function decryptStr(val) {
  if (typeof val !== "string") return val;
  // پشتیبانی از داده‌های قدیمی v1
  const isV1 = val.startsWith("enc:v1:");
  if (!val.startsWith(ENC_PREFIX) && !isV1) return val;
  if (!sessionKey) return "🔒 قفل";
  try {
    const body = isV1 ? val.slice("enc:v1:".length) : val.slice(ENC_PREFIX.length);
    const [ivB, ctB] = body.split(":");
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(ivB) }, sessionKey, b64ToBytes(ctB));
    const txt = new TextDecoder().decode(pt);
    _decCache.set(val, txt);
    return txt;
  } catch (e) { return "🔒 (رمزگشایی نشد)"; }
}
/* کش رمزگشایی برای نمایش همگام‌ساز */
const _decCache = new Map();
/* رمزگشایی کل DB برای پر کردن کش (یک‌بار پس از ورود/بارگذاری) */
async function preDecryptAll() {
  if (!sessionKey) return;
  const jobs = [];
  for (const it of DB.items) {
    if (it.saleInfo && it.saleInfo.enc) {
      for (const f of SENSITIVE_SALE_FIELDS) {
        const v = it.saleInfo[f];
        if (isEncVal(v) && !_decCache.has(v)) jobs.push(decryptStr(v));
      }
    }
  }
  await Promise.all(jobs);
}

/* ساخت رکورد فروش با رمزنگاری فیلدهای حساس */
async function buildSaleRecord(data) {
  const rec = Object.assign({}, data);
  for (const f of SENSITIVE_SALE_FIELDS) {
    if (rec[f]) {
      const plain = String(rec[f]);
      rec[f] = await encryptStr(plain);
      if (isEncVal(rec[f])) _decCache.set(rec[f], plain);
    }
  }
  rec.enc = true;
  return rec;
}
function decryptSale(sale) {
  if (!sale) return sale;
  const out = Object.assign({}, sale);
  if (!sale.enc) return out;
  for (const f of SENSITIVE_SALE_FIELDS) {
    const v = sale[f];
    if (typeof v === "string" && (v.startsWith(ENC_PREFIX) || v.startsWith("enc:v1:"))) {
      out[f] = _decCache.has(v) ? _decCache.get(v) : "🔒 رمزگذاری‌شده";
    }
  }
  return out;
}
async function decryptSaleFull(sale) {
  if (!sale || !sale.enc) return sale;
  const out = Object.assign({}, sale);
  for (const f of SENSITIVE_SALE_FIELDS) out[f] = await decryptStr(sale[f]);
  return out;
}
function isEncVal(v) { return typeof v === "string" && (v.startsWith(ENC_PREFIX) || v.startsWith("enc:v1:")); }
/* جستجو روی نسخه رمزگشایی‌شده (کش‌دار) */
const _decIndex = new Map();
async function searchSaleAsync(item, q) {
  const s = q.toLowerCase();
  const sale = await decryptSaleFull(item.saleInfo || {});
  const fields = [sale.buyer, sale.father, sale.national, sale.phone, sale.address, sale.receipt]
    .filter(Boolean).map(x => String(x).toLowerCase());
  return fields.some(f => f.includes(s));
}
function maskNational(n) {
  if (!n) return "-";
  if (isEncVal(n)) {
    if (!_decCache.has(n)) return "🔒";
    n = _decCache.get(n);
  }
  if (currentUser && currentUser.role === "manager") return esc(n);
  return esc(String(n).slice(0, 3)) + "*****" + esc(String(n).slice(-2));
}
function userTag() {
  if (!currentUser) return "-";
  return currentUser.role === "manager" ? "مدیر" : `${currentUser.username} (${currentUser.branch})`;
}

/* ==========================================================================
   کاربران، رمز عبور (salt-دار) و عبارت بازیابی
   ========================================================================== */
const WORDS_FA = ["کوه", "دریا", "خورشید", "ماه", "ستاره", "ابر", "باران", "برف", "باد", "آتش", "خاک", "سنگ",
  "درخت", "گل", "برگ", "ریشه", "شیر", "پلنگ", "عقاب", "اسب", "ماهی", "پرنده", "زنبور", "مورچه",
  "نان", "برنج", "چای", "عسل", "نمک", "شکر", "زیتون", "انار", "سیب", "انگور", "خرما", "گردو",
  "کتاب", "قلم", "دفتر", "کلید", "قفل", "درب", "پنجره", "دیوار", "پل", "راه", "جاده", "بندر"];
function generateRecoveryPhrase(n = 12) {
  const out = [];
  const rnd = randBytes(n);
  for (let i = 0; i < n; i++) out.push(WORDS_FA[rnd[i] % WORDS_FA.length]);
  return out.join(" ");
}

async function createUser(username, password, role, branch, opts = {}) {
  const salt = bytesToB64(randBytes(16));
  const passHash = bytesToB64(await pbkdf2(password, b64ToBytes(salt), "auth"));
  const u = {
    username, salt, passHash,
    role, branch: role === "manager" ? MANAGER : branch,
    createdAt: new Date().toISOString()
  };
  // فقط مدیر کلید داده و عبارت بازیابی دارد
  if (role === "manager" && opts.recovery) {
    const dataKey = randBytes(32);
    u.wrappedKeyPass = await wrapDataKey(dataKey, password);
    u.wrappedKeyRecovery = await wrapDataKey(dataKey, normalizePhrase(opts.recovery));
    u.recoveryHint = opts.recovery.split(" ").slice(0, 2).join(" ") + " ...";
  }
  DB.users.push(u);
  if (typeof markUserDirty === "function") markUserDirty(username, true);
  return u;
}
async function verifyUser(username, password) {
  const u = DB.users.find(x => x.username === username);
  if (!u) return null;
  if (u.salt && u.passHash) {
    const h = bytesToB64(await pbkdf2(password, b64ToBytes(u.salt), "auth"));
    if (h === u.passHash) return u;
    return null;
  }
  // سازگاری با کاربران قدیمی بدون salt
  const old = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("moto$" + password))
    .then(b => bytesToB64(new Uint8Array(b)));
  return old === u.passHash ? u : null;
}
function normalizePhrase(p) {
  return String(p || "").trim().replace(/\s+/g, " ");
}
/* باز کردن کلید داده با رمز کاربر */
async function unlockWithPassword(user, password) {
  if (!user.wrappedKeyPass) throw new Error("no-key");
  const dataKey = await unwrapDataKey(user.wrappedKeyPass, password);
  sessionKey = await aeadKey(dataKey);
  return true;
}
/* باز کردن کلید داده با عبارت بازیابی */
async function unlockWithRecovery(username, phrase) {
  const u = DB.users.find(x => x.username === username);
  if (!u || !u.wrappedKeyRecovery) throw new Error("no-recovery");
  const dataKey = await unwrapDataKey(u.wrappedKeyRecovery, normalizePhrase(phrase));
  sessionKey = await aeadKey(dataKey);
  return dataKey;
}
/* تغییر رمز بدون از بین رفتن داده: کلید داده با رمز جدید بسته‌بندی می‌شود */
async function rewrapForNewPassword(user, newPassword) {
  // اگر sessionKey داریم، کلید داده فعلی را بازبسته‌بندی می‌کنیم
  if (!sessionKey) throw new Error("locked");
  const raw = await exportSessionKey();
  user.wrappedKeyPass = await wrapDataKey(raw, newPassword);
  const salt = bytesToB64(randBytes(16));
  user.salt = salt;
  user.passHash = bytesToB64(await pbkdf2(newPassword, b64ToBytes(salt), "auth"));
}
async function exportSessionKey() {
  const raw = await crypto.subtle.exportKey("raw", sessionKey);
  return new Uint8Array(raw);
}

/* ---------- ورود دستی تاریخ شمسی (قالب‌بندی خودکار) ---------- */
function attachManualDate(el) {
  if (!el || el.dataset.md) return;
  el.dataset.md = "1";
  const digits = s => s.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^\d]/g, "");
  el.addEventListener("input", () => {
    const d = digits(el.value);
    let out = d;
    if (d.length > 4) out = d.slice(0, 4) + "/" + d.slice(4);
    if (d.length > 6) out = d.slice(0, 4) + "/" + d.slice(4, 6) + "/" + d.slice(6, 8);
    el.value = out.slice(0, 10);
  });
  el.addEventListener("blur", () => {
    const d = digits(el.value);
    if (d.length === 8) el.value = d.slice(0, 4) + "/" + d.slice(4, 6) + "/" + d.slice(6, 8);
  });
}

/* ---------- انتخابگر تاریخ شمسی (روز/ماه/سال جداگانه) ---------- */function buildJalaliPicker(input) {
  if (input.dataset.dp) return;
  input.dataset.dp = "1";
  const wrap = input.parentElement;
  const pop = document.createElement("div");
  pop.className = "dp-pop";
  wrap.appendChild(pop);
  const today = todayJalali();
  const [tjy, tjm, tjd] = today.split("/").map(Number);
  let viewJy = tjy, viewJm = tjm;
  function parseVal() {
    const v = input.value.trim();
    if (!/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(v)) return null;
    const [y, m, d] = v.split("/").map(Number);
    return { y, m, d };
  }
  function firstDow(jy, jm) {
    const [gy, gm, gd] = toGregorian(jy, jm, 1);
    const dow = new Date(gy, gm - 1, gd).getDay();
    return (dow + 1) % 7;
  }
  function setVal(y, m, d) {
    const days = jalaliMonthDays(y, m);
    if (d > days) d = days;
    input.value = `${y}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
  }
  function render() {
    const days = jalaliMonthDays(viewJy, viewJm);
    const first = firstDow(viewJy, viewJm);
    const sel = parseVal();
    const selD = sel && sel.y === viewJy && sel.m === viewJm ? sel.d : "";
    // لیست سال‌ها (پیش‌فرض ۲۰ سال قبل تا ۵ سال بعد؛ برای تاریخ تولد بازه بزرگ‌تر)
    const yBack = input.dataset.dpBack ? +input.dataset.dpBack : 20;
    const years = [];
    for (let y = tjy - yBack; y <= tjy + 5; y++) years.push(y);
    let html = `<div class="dp-selects">
      <select class="dp-sel" data-part="day">
        <option value="">روز</option>
        ${Array.from({ length: days }, (_, i) => i + 1).map(d =>
          `<option value="${d}" ${selD === d ? "selected" : ""}>${d}</option>`).join("")}
      </select>
      <select class="dp-sel" data-part="month">
        ${FA_MONTHS.map((m, i) => `<option value="${i + 1}" ${viewJm === i + 1 ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <select class="dp-sel" data-part="year">
        ${years.map(y => `<option value="${y}" ${viewJy === y ? "selected" : ""}>${y}</option>`).join("")}
      </select>
    </div>
    <div class="dp-head">
      <button type="button" data-act="prevY">«</button>
      <button type="button" data-act="prevM">‹</button>
      <span>${FA_MONTHS[viewJm - 1]} ${viewJy}</span>
      <button type="button" data-act="nextM">›</button>
      <button type="button" data-act="nextY">»</button>
    </div><div class="dp-grid">`;
    FA_DOW.forEach(d => html += `<div class="dow">${d}</div>`);
    for (let i = 0; i < first; i++) html += `<div class="day empty"></div>`;
    for (let d = 1; d <= days; d++) {
      const isToday = (viewJy === tjy && viewJm === tjm && d === tjd);
      const isSel = sel && sel.y === viewJy && sel.m === viewJm && sel.d === d;
      html += `<div class="day${isToday ? " today" : ""}${isSel ? " sel" : ""}" data-day="${d}">${d}</div>`;
    }
    html += `</div><div class="dp-foot">امروز: ${today} — <a href="#" data-act="today">انتخاب امروز</a></div>`;
    pop.innerHTML = html;
    // انتخاب جداگانه روز/ماه/سال
    pop.querySelector('[data-part="day"]').onchange = e => {
      e.stopPropagation();
      const d = Number(e.target.value) || 1;
      setVal(viewJy, viewJm, d);
      input.dispatchEvent(new Event("change"));
    };
    pop.querySelector('[data-part="month"]').onchange = e => {
      e.stopPropagation();
      viewJm = Number(e.target.value) || 1;
      const d = parseVal() ? parseVal().d : 1;
      setVal(viewJy, viewJm, d);
      render(); input.dispatchEvent(new Event("change"));
    };
    pop.querySelector('[data-part="year"]').onchange = e => {
      e.stopPropagation();
      viewJy = Number(e.target.value) || tjy;
      const d = parseVal() ? parseVal().d : 1;
      setVal(viewJy, viewJm, d);
      render(); input.dispatchEvent(new Event("change"));
    };
    pop.querySelectorAll("[data-act]").forEach(b => {
      b.onclick = e => {
        e.preventDefault(); e.stopPropagation();
        const a = b.dataset.act;
        if (a === "prevY") viewJy--; else if (a === "nextY") viewJy++;
        else if (a === "prevM") { viewJm--; if (viewJm < 1) { viewJm = 12; viewJy--; } }
        else if (a === "nextM") { viewJm++; if (viewJm > 12) { viewJm = 1; viewJy++; } }
        else if (a === "today") { input.value = today; pop.classList.remove("active"); input.dispatchEvent(new Event("change")); return; }
        render();
      };
    });
    pop.querySelectorAll(".day:not(.empty)").forEach(d => {
      d.onclick = () => {
        const day = Number(d.dataset.day);
        input.value = `${viewJy}/${String(viewJm).padStart(2, "0")}/${String(day).padStart(2, "0")}`;
        pop.classList.remove("active");
        input.dispatchEvent(new Event("change"));
      };
    });
  }
  input.addEventListener("click", e => {
    e.stopPropagation();
    const v = parseVal();
    if (v) { viewJy = v.y; viewJm = v.m; }
    render();
    pop.classList.toggle("active");
  });
  document.addEventListener("click", e => { if (!wrap.contains(e.target)) pop.classList.remove("active"); });
}

let modalCb = null, modalExtraCb = null;
function openModal(title, msg, cb, confirmText = "تایید", onOpen) {
  $("modalTitle").innerHTML = title;
  $("modalMsg").innerHTML = msg;
  $("modalBack").classList.add("active");
  const btn = $("modalConfirm");
  btn.textContent = confirmText;
  btn.style.display = cb ? "inline-block" : "none";
  btn.onclick = async () => { if (modalCb) { const r = modalCb(); if (r && r.then) { btn.disabled = true; try { await r; } finally { btn.disabled = false; } } } };
  modalCb = cb;
  if (onOpen) setTimeout(onOpen, 30);
}
function closeModal() {
  $("modalBack").classList.remove("active");
  $("modalMsg").innerHTML = "";
  modalCb = null; modalExtraCb = null;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("modalBack").classList.contains("active")) closeModal();

  if (e.ctrlKey && e.key.toLowerCase() === "s") { e.preventDefault(); save(); toast("💾 ذخیره شد"); }

});

/* ---------- CSV ---------- */
function toCSV(rows) {
  return rows.map(r => r.map(c => {
    const s = String(c == null ? "" : c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
}
function downloadCSV(filename, rows) {
  const csv = "\uFEFF" + toCSV(rows);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadJSON(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ==========================================================================
   ذخیره‌سازی امن در فایل (File System Access API)
   داده‌ها علاوه بر مرورگر، در یک فایل واقعی روی هارد ذخیره می‌شود که
   می‌توان آن را در Google Drive / OneDrive گذاشت تا از هر دستگاهی در دسترس باشد.
   ========================================================================== */
let fileHandle = null;
const FS_DB = "moto_warehouse_fs";
let autoSaveTimer = null;

function fsSupported() {
  return typeof window.showSaveFilePicker === "function" && window.isSecureContext;
}

async function initFileStorage() {
  // اگر قبلا فایل وصل شده و مرورگر مجوز داده، دوباره وصل شو
  try {
    const saved = await idbGet(FS_DB, "handle");
    if (saved && saved.queryPermission) {
      const perm = await saved.queryPermission({ mode: "readwrite" });
      if (perm === "granted") {
        fileHandle = saved;
        await pullFromFile(true);
      } else {
        // نیاز به تایید کاربر با یک کلیک
        setFileBanner("reconnect");
      }
    }
  } catch (e) { /* ignore */ }
}

function setFileBanner(state) {
  const el = $("fileBanner");
  if (!el) return;
  if (state === "connected") {
    el.className = "alert info";
    el.innerHTML = `🔐 <b>ذخیره امن فعال است.</b> داده‌ها به‌طور خودکار در فایل <b>${esc(fileHandle ? fileHandle.name : "")}</b> ذخیره می‌شوند.`;
  } else if (state === "reconnect") {
    el.className = "alert warn";
    el.innerHTML = `🔒 فایل امن قبلی پیدا شد. برای اتصال مجدد <button class="btn small success" onclick="reconnectFile()">اینجا کلیک کنید</button>`;
  } else if (state === "unsupported") {
    el.className = "alert warn";
    el.innerHTML = `⚠️ مرورگر شما از ذخیره مستقیم در فایل پشتیبانی نمی‌کند. از دکمه «دانلود پشتیبان» استفاده کنید (Chrome/Edge پیشنهاد می‌شود).`;
  } else {

}

async function connectFile() {
  if (!fsSupported()) { toast("مرورگر پشتیبانی نمی‌کند — از Chrome یا Edge استفاده کنید", false); return; }
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: `moto-warehouse-${todayJalali().replace(/\//g, "-")}.json`,
      types: [{ description: "فایل داده انبار", accept: { "application/json": [".json"] } }]
    });
    await idbSet(FS_DB, "handle", fileHandle);
    await writeFile();
    setFileBanner("connected");
    toast("🔐 فایل امن وصل شد — ذخیره خودکار فعال است");
  } catch (e) { if (e.name !== "AbortError") toast("اتصال لغو شد", false); }
}

async function reconnectFile() {
  try {
    const saved = await idbGet(FS_DB, "handle");
    if (!saved) return;
    const perm = await saved.requestPermission({ mode: "readwrite" });
    if (perm === "granted") {
      fileHandle = saved;
      await pullFromFile(false);
      setFileBanner("connected");
      toast("🔐 متصل شد");
    } else { toast("دسترسی داده نشد", false); }
  } catch (e) { toast("اتصال ناموفق", false); }
}

async function writeFile() {
  if (!fileHandle) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" }));
    await w.close();
  } catch (e) { console.warn("write failed", e); }
}

async function pullFromFile(silent) {
  if (!fileHandle) return;
  try {
    const f = await fileHandle.getFile();
    const txt = await f.text();
    if (!txt.trim()) { await writeFile(); return; }
    const d = JSON.parse(txt);
    if (d.items && d.items.length) {
      // داده فایل را ترجیح بده اگر از نسخه مرورگر جدیدتر است
      const fsTime = d.settings && d.settings.lastSaved ? d.settings.lastSaved : "";
      const dbTime = DB.settings && DB.settings.lastSaved ? DB.settings.lastSaved : "";
      if (fsTime >= dbTime) {
        DB = { items: d.items || [], history: d.history || [], activity: d.activity || [], settings: Object.assign({}, DEFAULT_SETTINGS, d.settings || {}) };
        if (!branches().includes(activeBranch)) activeBranch = branches()[0];
        localStorage.setItem(LS_KEY, JSON.stringify(DB));
      } else {
        await writeFile();
      }
    }
    if (!silent) { renderBranchTabs(); renderDashboard(); toast("📂 داده‌ها از فایل خوانده شد"); }
    else if (DB.items.length) { renderBranchTabs(); renderDashboard(); }
  } catch (e) { console.warn("pull failed", e); }
}

function scheduleFileSave() {
  if (!fileHandle) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(writeFile, 1200);
}

async function disconnectFile() {
  fileHandle = null;
  await idbSet(FS_DB, "handle", null).catch(() => {});
  setFileBanner("idle");
  toast("اتصال فایل قطع شد");
}

/* IndexedDB کوچک برای نگه‌داشتن handle فایل */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("moto_fs_store", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readonly");
    const req = tx.objectStore("kv").get(k);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

/* ==========================================================================
   انتخاب شعبه و ناوبری
   ========================================================================== */
function renderBranchTabs() {
  const wrap = $("branchTabs");
  wrap.innerHTML = "";
  const allowed = canManage() ? branches() : branches().filter(b => currentUser && b === currentUser.branch);
  allowed.forEach(b => {
    const cnt = DB.items.filter(i => i.branch === b && i.status === STATUS.IN && !i.deleted).length;
    const btn = document.createElement("button");
    btn.innerHTML = `${esc(b)} <span class="cnt">${cnt}</span>`;
    btn.onclick = () => selectBranch(b);
    if (activeBranch === b) btn.classList.add("active");
    wrap.appendChild(btn);
  });
  if (canManage()) {
    const mgr = document.createElement("button");
    const totalIn = DB.items.filter(i => i.status === STATUS.IN && !i.deleted).length;
    mgr.innerHTML = `👔 مدیر مرکزی (همه شعب) <span class="cnt">${totalIn}</span>`;
    mgr.className = "manager";
    mgr.onclick = () => selectBranch(MANAGER);
    if (activeBranch === MANAGER) mgr.classList.add("active");
    wrap.appendChild(mgr);
  }

  const label = branchLabel(activeBranch);
  ["dashBranchLabel", "inBranchLabel", "outBranchLabel", "cycBranchLabel", "invBranchLabel"].forEach(id => {
    const el = $(id); if (el) el.textContent = label;
  });
  if ($("dashBranchLabel")) $("dashBranchLabel").textContent = activeBranch === MANAGER ? "👔 مدیر مرکزی - نمای کلی" : `شعبه: ${activeBranch}`;
}

function selectBranch(b) {
  if (b === MANAGER && !canManage()) { toast("فقط مدیر می‌تواند همه شعب را ببیند", false); return; }
  if (b !== MANAGER && !canManage() && currentUser && currentUser.branch !== b) { toast("دسترسی به این شعبه ندارید", false); return; }
  activeBranch = b;
  renderBranchTabs();
  save();
  const activeTab = document.querySelector("#mainNav button.active").dataset.tab;
  refreshTab(activeTab);
}

const TAB_RENDERERS = {
  dash: renderDashboard, inv: renderInventory, cycle: renderCycle, out: refreshOutItems,
  report: renderReport, log: renderLog, settings: renderSettings,
  archive: renderArchive, kardex: renderKardex,
  backup: () => { renderStorageInfo(); refreshFileBanner(); }
};
function refreshFileBanner() {
  if (fileHandle) setFileBanner("connected");
  else if (!fsSupported()) setFileBanner("unsupported");
  else setFileBanner("idle");
}
function refreshTab(tab) {
  if (TAB_RENDERERS[tab]) TAB_RENDERERS[tab]();
  if (tab === "in") { populateDatalists(); $("in_date").value = $("in_date").value || todayJalali(); }
  if (tab === "settings") renderSettings();
}

function setupNav() {
  document.querySelectorAll("#mainNav button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll("#mainNav button").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      $("tab-" + b.dataset.tab).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      refreshTab(b.dataset.tab);
    };
  });
  document.querySelectorAll("#invTabs button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll("#invTabs button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      uiState.invTab = b.dataset.invtab;
      renderInventory();
    };
  });
  document.querySelectorAll("#arcTabs button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll("#arcTabs button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      uiState.arcTab = b.dataset.arctab;
      renderArchive();
    };
  });
}

function addEntry() {

         <select id="mgr_target">${branches().map(b => `<option>${esc(b)}</option>`).join("")}</select></div>`);

function doAddEntry(branch) {
  clearErrs($("inForm"));
  const barname = $("in_barname").value.trim();
  const date = $("in_date").value.trim();
  const supplier = $("in_supplier").value.trim();
  const receiver = $("in_receiver").value.trim();
  const company = $("in_company").value.trim();
  const name = $("in_name").value.trim();
  const chassis = $("in_chassis").value.trim();
  const qty = Math.max(1, parseInt($("in_qty").value) || 1);
  const engine = $("in_engine").value.trim();
  const plate = $("in_plate").value.trim();
  const price = getNumber($("in_price"));

  let ok = true;
  ok &= validateField($("in_barname"), barname, "شماره بارنامه الزامی است");
  ok &= validateField($("in_date"), date, "تاریخ خرید الزامی است");
  ok &= validateField($("in_supplier"), supplier, "نام تامین‌کننده الزامی است");
  ok &= validateField($("in_receiver"), receiver, "نام تحویل‌گیرنده الزامی است");
  ok &= validateField($("in_company"), company, "نام شرکت الزامی است");
  ok &= validateField($("in_name"), name, "نام موتور الزامی است");
  ok &= validateField($("in_chassis"), chassis, "شماره شاسی الزامی است");
  ok &= validateField($("in_price"), price > 0, "قیمت خرید باید بزرگ‌تر از صفر باشد");
  if (!ok) { toast("لطفا خطاهای فرم را اصلاح کنید", false); focusFirstErr(); return; }

  // هشدار شناسه‌های تکراری
  const dups = [];
  const norm = s => s.toLowerCase().trim();
  DB.items.filter(i => !i.deleted).forEach(i => {
    if (chassis && norm(i.chassis) === norm(chassis)) dups.push(`شاسی «${chassis}» (در ${i.branch})`);
    if (engine && norm(i.engine) === norm(engine)) dups.push(`شماره موتور «${engine}» (در ${i.branch})`);
    if (plate && norm(i.plate) === norm(plate)) dups.push(`شماره پلاک «${plate}» (در ${i.branch})`);
  });
  if (dups.length) {
    openModal("⚠️ شناسه تکراری", `این موارد قبلا ثبت شده‌اند:<br><br><b>${dups.map(esc).join("<br>")}</b><br><br>آیا باز هم ثبت شود؟`, () => {
      closeModal(); pushItems(branch, { barname, date, supplier, receiver, company, name, chassis, qty, plateSerial: "", price });
    }, "بله، ثبت کن");
    return;
  }
  pushItems(branch, { barname, date, supplier, receiver, company, name, chassis, qty, plateSerial: "", price });
}

function pushItems(branch, d) {
  const now = new Date().toISOString();
  const newIds = [];
  for (let i = 0; i < d.qty; i++) {
    const item = {
      id: uid("it"), branch,
      company: d.company, name: $("in_name").value.trim(),
      group: $("in_group") ? $("in_group").value : "",
      volume: $("in_volume").value.trim(),
      type: $("in_type") ? $("in_type").value.trim() : "",
      color: $("in_color").value.trim(),
      year: $("in_year").value.trim(),
      chassis: d.qty > 1 ? `${d.chassis}-${i + 1}` : d.chassis,
      engine: $("in_engine").value.trim(),
      plate: $("in_plate").value.trim(),
      price: d.price,
      payStatus: $("in_payStatus").value,
      prepay: getNumber($("in_prepay")),
      specs: $("in_specs").value.trim(),
      note: $("in_note").value.trim(),
      supplier: d.supplier, supplierPhone: $("in_supplier_phone").value.trim(),
      barname: d.barname, receiver: d.receiver,
      dateIn: d.date, status: STATUS.IN,
      saleInfo: null, exitInfo: null,
      createdBy: currentUser ? currentUser.username : "",
      createdAt: now
    };
    DB.items.push(item);
    newIds.push(item.id);
    pushHistory({
      id: uid("h"), itemId: item.id, branch,
      action: "in", fromStatus: null, toStatus: STATUS.IN, date: d.date,
      note: `ورود از بارنامه ${d.barname} - تامین‌کننده: ${d.supplier} - تحویل‌گیرنده: ${d.receiver}`,
      by: currentUser ? currentUser.username : "",
      createdAt: now
    });
  }
  save({ items: newIds });
  logActivity("ورود کالا", `${d.qty} × ${d.company} ${$("in_name").value.trim()} به ${branch} — بارنامه ${d.barname}`);
  toast(`✅ ${d.qty} موتور در ${branch} ثبت شد`);
  clearForm("in");
  renderBranchTabs(); renderDashboard();
  if (typeof checkGroupAlerts === "function") setTimeout(checkGroupAlerts, 300);
}

function toggleOutType() {
  const t = $("out_type").value;
  const isSale = t === "sale";
  $("f_toBranch").style.display = isSale ? "none" : "flex";
  $("f_transferKind").style.display = isSale ? "none" : "flex";
  ["f_buyer", "f_father", "f_national", "f_birth", "f_buyerType", "f_phone", "f_payStatus", "f_salePrice", "f_discount", "f_tradeIn", "f_address"]
    .forEach(id => { $(id).style.display = isSale ? "flex" : "none"; });
  if (isSale) { fillPayStatus(); }
  refreshOutItems();
}
function fillPayStatus() {
  const sel = $("out_payStatus");
  if (!sel) return;
  const buyerType = $("out_buyerType").value;
  sel.innerHTML = "";
  (buyerType === "همکار" ? COLLEAGUE_PAY : CUSTOMER_PAY).forEach(o => {
    const op = document.createElement("option"); op.value = o; op.textContent = o;
    sel.appendChild(op);
  });
}
function filterOutItems() {
  const q = ($("out_itemSearch").value || "").trim().toLowerCase();
  const sel = $("out_item");
  const prev = sel.value;
  sel.innerHTML = '<option value="">-- انتخاب کنید --</option>';
  const from = isManager() ? null : activeBranch;
  DB.items.forEach(en => {
    if (en.status !== STATUS.IN || en.deleted) return;
    if (from && en.branch !== from) return;
    const txt = `[${en.branch}] ${en.company} ${en.name} ${en.color || ""} ${en.chassis} ${en.plate || ""}`.toLowerCase();
    if (q && !txt.includes(q)) return;
    const o = document.createElement("option");
    o.value = en.id;
    o.textContent = `[${en.branch}] ${en.company} ${en.name} - ${en.color || "-"} - شاسی:${en.chassis} - پلاک:${en.plate || "-"}`;
    sel.appendChild(o);
  });
  sel.value = prev && sel.querySelector(`option[value="${prev}"]`) ? prev : "";
  const n = sel.options.length - 1;
  $("out_itemHint").textContent = n ? `${n} موتور موجود` : "⚠️ موتور موجودی در این شعبه یافت نشد";
  $("out_itemHint").className = "helper";
}
function refreshOutItems() {
  const to = $("out_to");
  if (to) {
    const cur = to.value;
    to.innerHTML = "";
    branches().forEach(b => { const o = document.createElement("option"); o.value = b; o.textContent = b; to.appendChild(o); });
    to.value = cur || branches().find(b => b !== activeBranch) || branches()[0];
  }
  filterOutItems();
}

async function addExit() {
  clearErrs($("outForm"));
  const type = $("out_type").value;
  const receipt = $("out_receipt").value.trim();
  if (!$("out_date").value.trim()) $("out_date").value = todayJalali();
  const date = $("out_date").value.trim();
  const itemId = $("out_item").value;

  let ok = true;
  ok &= validateField($("out_receipt"), receipt, "شماره قولنامه/رسید الزامی است");
  ok &= validateField($("out_item"), itemId, "یک موتور انتخاب کنید");
  const item = DB.items.find(e => e.id === itemId);
  if (item && item.status !== STATUS.IN) { validateField($("out_item"), false, "موتور در وضعیت موجود نیست"); ok = false; }
  if (!ok) { toast("لطفا خطاهای فرم را اصلاح کنید", false); focusFirstErr(); return; }

  const from = item.branch;

  if (type === "sale") {
    const buyer = $("out_buyer").value.trim();
    const national = $("out_national").value.trim();
    ok &= validateField($("out_buyer"), buyer, "نام خریدار الزامی است");
    ok &= validateField($("out_national"), !national || /^\d{10}$/.test(national), "کد ملی باید ۱۰ رقم باشد");
    const salePrice = getNumber($("out_price"));
    ok &= validateField($("out_price"), salePrice > 0, "قیمت فروش باید بزرگ‌تر از صفر باشد");
    if (!ok) { toast("لطفا خطاهای فرم را اصلاح کنید", false); focusFirstErr(); return; }

    const payStatus = $("out_payStatus").value;
    item.saleInfo = await buildSaleRecord({
      receipt, date, from, buyer,
      father: $("out_father").value.trim(),
      national, birth: $("out_birth").value.trim(),
      buyerType: $("out_buyerType").value,
      phone: $("out_phone").value.trim(),
      address: $("out_address").value.trim(),
      payStatus, salePrice,
      discount: getNumber($("out_discount")),
      tradeIn: getNumber($("out_tradeIn")),
      note: $("out_note").value.trim()
    });
    item.saleDate = date;
    item.soldBy = userTag();
    item.reserveInfo = null;
    changeStatusInternal(item, STATUS.SALE, `فروش به ${buyer} (${item.saleInfo.buyerType}) - قولنامه:${receipt} - وضعیت:${payStatus}`);
  } else {
    const to = $("out_to").value;
    if (to === from) { toast("شعبه مقصد با مبدا یکسان است", false); return; }
    const kind = $("out_transferKind").value;
    item.exitInfo = { receipt, date, from, to, transferKind: kind, note: $("out_note").value.trim() };
    changeStatusInternal(item, STATUS.OUT, `انتقال (${kind}) به ${to} - خروج از ${from} - رسید:${receipt}`);
    const sourceBranch = from;
    item.branch = to; item.status = STATUS.IN; item.dateIn = date;
    pushHistory({
      id: uid("h"), itemId: item.id, branch: to,
      action: "in", fromStatus: STATUS.OUT, toStatus: STATUS.IN, date,
      note: `ورود به ${to} بابت انتقال (${kind}) از ${sourceBranch} - رسید:${receipt}`,
      by: userTag(),
      createdAt: new Date().toISOString()
    });
  }
  save({ items: [item.id] });
  logActivity("خروج کالا", type === "sale" ? `فروش ${item.company} ${item.name} — قولنامه ${receipt}` : `انتقال ${item.company} ${item.name} به ${item.branch}`);
  toast("✅ خروج کالا ثبت شد");
  clearForm("out");
  toggleOutType();
  renderBranchTabs(); renderDashboard();
  if (typeof checkGroupAlerts === "function") setTimeout(checkGroupAlerts, 300);
}

function changeStatusInternal(item, newStatus, note) {
  const old = item.status;
  item.status = newStatus;
  const extra = {};
  // اگر از حالت رزرو خارج می‌شود، اطلاعات رزرو در تاریخچه ثبت شود
  if (old === STATUS.RESERVED && item.reserveInfo) {
    extra.reserve = item.reserveInfo;
    extra.reserveReleased = true;
  }
  pushHistory({
    id: uid("h"), itemId: item.id, branch: item.branch,
    action: "status", fromStatus: old, toStatus: newStatus,
    date: todayJalali(), note: note || "تغییر وضعیت",
    by: typeof userTag === "function" ? userTag() : "-",
    extra: Object.keys(extra).length ? extra : undefined,
    createdAt: new Date().toISOString()
  });
}

function itemsForActiveBranch() {
  // موتورهای حذف‌شده و آرشیوشده در لیست فعال نمایش داده نمی‌شوند
  const base = DB.items.filter(i => !i.deleted && !i.archived);
  if (isManager()) return base;
  return base.filter(i => i.branch === activeBranch);
}
function globalSearch(item, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  const sale = decryptSale(item.saleInfo || {});
  const fields = [sale.buyer, sale.father, item.branch,
    item.name, item.company, item.volume, item.type, item.color, item.chassis, item.engine, item.plate,
    item.supplier, item.barname, sale.receipt, sale.national, sale.phone, sale.payStatus,
    sale.buyerType, item.receiver].filter(Boolean).map(x => String(x).toLowerCase());
  return fields.some(f => f.includes(s));
}
function sortRows(rows, state) {
  if (!state.key) return rows;
  const k = state.key, dir = state.dir;
  const val = it => {
    if (k === "price") return it.price || 0;
    if (k === "name") return (it.name || "");
    if (k === "date") return jalaliToISO(it.dateIn || "");
    return it[k] || "";
  };
  return [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
    return String(x).localeCompare(String(y), "fa") * dir;
  });
}
function sortIndicator(state, key) {
  if (state.key !== key) return " ⇅";
  return state.dir === 1 ? " ▲" : " ▼";
}
function clickSort(table, key, state, rerender) {
  if (state.key === key) state.dir *= -1; else { state.key = key; state.dir = 1; }
  rerender();
}

   چرخه موتورها
   ========================================================================== */
function resetCycleFilters() {
  $("cyc_q").value = ""; $("cyc_status").value = ""; $("cyc_from").value = ""; $("cyc_to").value = "";
  renderCycle();
}
function renderCycle() {
  const q = ($("cyc_q") ? $("cyc_q").value : "").trim();
  const fStatus = $("cyc_status") ? $("cyc_status").value : "";
  const from = $("cyc_from") ? jalaliToISO($("cyc_from").value) : "";
  const to = $("cyc_to") ? jalaliToISO($("cyc_to").value) : "";
  const evDate = it => jalaliToISO(it.saleDate || it.lastReturn || it.dateIn);

  let rows = itemsForActiveBranch().filter(it => {
    if (fStatus && it.status !== fStatus) return false;
    if (from && evDate(it) < from) return false;
    if (to && evDate(it) > to) return false;
    return globalSearch(it, q);
  });
  rows = sortRows(rows, uiState.sort.cycle);
  const totalCount = rows.length;
  const pg = paginate(rows, "cyc");
  rows = pg.pageRows;
  $("cycCount").textContent = `${totalCount} مورد — صفحه ${pg.cur} از ${pg.pages}`;
  if (!totalCount) { $("cycTable").innerHTML = '<div class="empty">موردی یافت نشد</div>'; return; }

  const cols = getCols("cyc");
  const cellVal = (it, k, s) => {
    switch (k) {
      case "status": return statusBadge(it.status);
      case "group": return it.group ? `<span class="badge b-in">${esc(groupLabel(it.group))}</span>` : "-";
      case "buyer": return esc(s.buyer) || "-";
      case "national": return `<span style="font-size:10px;direction:ltr;">${maskNational(s.national)}</span>`;
      case "phone": return `<span style="direction:ltr;">${esc(s.phone) || "-"}</span>`;
      case "payStatus": return s.payStatus ? payBadge(s.payStatus) : "-";
      case "salePrice": return money(s.salePrice);
      case "receipt": return esc(s.receipt) || "-";
      case "saleDate": return esc(it.saleDate || s.date) || "-";
      case "volume": case "type": case "color": case "year": return esc(it[k]) || "-";
      case "engine": case "chassis": return `<span style="font-size:10px;direction:ltr;">${esc(it[k]) || "-"}</span>`;
      case "plate": return `<span style="direction:ltr;">${esc(it.plate) || "-"}</span>`;
      case "returnCount": return it.returnCount ? `<span class="badge b-return">${it.returnCount} بار</span>` : "-";
      case "company": return `<b>${esc(it.company)}</b>`;
      default: return esc(it[k]) || "-";
    }
  };
  $("cycTable").innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr>
      ${cols.map(c => `<th class="no-sort">${esc(c.label)}</th>`).join("")}
      <th class="no-sort">عملیات</th>
    </tr></thead><tbody>` +
    rows.map(it => {
      const s = decryptSale(it.saleInfo || {});
      const nextLabel = { "موجود": "💰 فروش", "رزرو": "💰 فروش", "فروش": "📤 خروج", "خروج": "🔄 برگشتی", "برگشتی": "✅ بازگشت" }[it.status] || "—";
      const reserveBtn = it.status === STATUS.IN ? `<button class="btn small" onclick="openReserveModal('${it.id}')">🔖 رزرو</button>` : "";
      const unreserveBtn = it.status === STATUS.RESERVED ? `<button class="btn small gray" onclick="unreserveItem('${it.id}')">↩️ لغو رزرو</button>` : "";
      return `<tr>
        ${cols.map(c => `<td>${cellVal(it, c.k, s)}</td>`).join("")}
        <td style="white-space:nowrap;">
          <button class="btn small warn" onclick="nextStatusClick('${it.id}')">${nextLabel}</button>
          ${reserveBtn}${unreserveBtn}
          <button class="btn small success" onclick="editItem('${it.id}')">✏️</button>
          <button class="btn small" onclick="showHistory('${it.id}')">📜</button>
          ${canManage() ? `<button class="btn small" onclick="openStockAdjust('${it.id}')" title="اصلاح موجودی">🔧</button>
          <button class="btn small" onclick="openSupplierReturn('${it.id}')" title="برگشت به تامین‌کننده">↩️</button>` : ""}
        </td>
      </tr>`;
    }).join("") + "</tbody></table></div>" + pg.bar;
}

function exportCycleCSV() {
  const rows = [["شعبه", "شرکت", "نام", "حجم", "رنگ", "شاسی", "پلاک", "مشتری", "کد ملی", "وضعیت فروش", "وضعیت", "قیمت خرید", "قیمت فروش"]];
  itemsForActiveBranch().forEach(it => {
    const s = decryptSale(it.saleInfo || {});
    const nat = isManager() ? (s.national || "") : maskNational(s.national);
    rows.push([it.branch, it.company, it.name, it.volume, it.color, it.chassis, it.plate, s.buyer, nat, s.payStatus, it.status, it.price, s.salePrice]);
  });
  downloadCSV(`cycle-${todayJalali().replace(/\//g, "-")}.csv`, rows);
  toast("✅ فایل CSV دانلود شد");
}

function nextStatusClick(itemId) {
  const item = DB.items.find(e => e.id === itemId);
  if (!item) return;
  if (item.status === STATUS.IN || item.status === STATUS.RESERVED) openSaleModal(item);
  else if (item.status === STATUS.SALE) {
    openModal("تایید خروج", `خروج موتور <b>${esc(item.company)} ${esc(item.name)}</b> (پلاک: ${esc(item.plate) || "-"})؟`, () => {
      changeStatusInternal(item, STATUS.OUT, "خروج قطعی از انبار");
      save({ items: [item.id] }); closeModal(); toast("✅ خروج ثبت شد"); renderCycle(); renderDashboard();
    });
  } else if (item.status === STATUS.OUT) {
    openReturnModal(item);
  } else if (item.status === STATUS.RETURN) {
    openModal("بازگشت به انبار", `موتور <b>${esc(item.company)} ${esc(item.name)}</b> به انبار برگردد؟`, () => {
      changeStatusInternal(item, STATUS.IN, "بازگشت به موجودی");
      save({ items: [item.id] }); closeModal(); toast("✅ به موجودی بازگشت"); renderCycle(); renderDashboard();
    });
  }
}

/* فرم برگشتی: تاریخ + دلیل + نام خریدار (قابل چندبار ثبت) */
function openReturnModal(item) {
  const prevSales = DB.history.filter(h => h.itemId === item.id && h.action === "sale");
  const lastBuyer = item.saleInfo ? (decryptSale(item.saleInfo).buyer || "") : "";
  const html = `
    <div class="alert" style="background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;">
      ℹ️ این موتور قبلاً ${prevSales.length} بار فروش/برگشت ثبت شده است. هر برگشت به‌صورت جداگانه در تاریخچه حفظ می‌شود.
    </div>
    <div class="field"><label>نام خریدار (برگشت‌دهنده)</label><input id="ret_buyer" value="${esc(lastBuyer)}"></div>
    <div class="field" style="margin-top:8px;"><label>تاریخ برگشت (شمسی) *</label><div class="dp-wrap"><input class="dp-input" id="ret_date" readonly></div></div>
    <div class="field" style="margin-top:8px;"><label>دلیل برگشت *</label><textarea id="ret_reason" rows="2" placeholder="مثلاً: عدم رضایت مشتری، ایراد فنی، ..."></textarea></div>
    <div class="field" style="margin-top:8px;"><label>توضیحات (اختیاری)</label><textarea id="ret_note" rows="2"></textarea></div>
    <div id="ret_err" class="login-err"></div>`;
  openModal("🔄 ثبت برگشتی", html, () => {
    const date = $("ret_date").value.trim();
    const reason = $("ret_reason").value.trim();
    const buyer = $("ret_buyer").value.trim();
    const note = $("ret_note").value.trim();
    const err = $("ret_err");
    if (!date) { err.textContent = "تاریخ برگشت الزامی است"; return; }
    if (!reason) { err.textContent = "دلیل برگشت الزامی است"; return; }

    // مقادیر را از قبل نگه می‌داریم چون مودال هشدار فرم را جایگزین می‌کند
    const doReturn = () => {
      const extra = { buyer, returnReason: reason, returnDate: date, note };
      pushHistory({
        itemId: item.id, branch: item.branch, action: "return",
        fromStatus: item.status, toStatus: STATUS.RETURN, date,
        note: `برگشت از ${buyer || "نامشخص"} — دلیل: ${reason}${note ? " — " + note : ""}`,
        by: userTag(), plate: item.plate || "", extra
      });
      item.returnCount = (item.returnCount || 0) + 1;
      item.lastReturn = { buyer, reason, date };
      changeStatusInternal(item, STATUS.RETURN, `برگشتی از ${buyer || "نامشخص"} — ${reason}`);
      save({ items: [item.id] });
      closeModal(); toast("🔄 برگشتی ثبت شد"); renderCycle(); renderDashboard();
    };

    // تغییر ۳: هشدار تکراری بر اساس نام خریدار + پلاک
    const norm = s => String(s || "").toLowerCase().trim();
    const dupByBuyer = buyer ? DB.history.filter(h => h.action === "return" && norm(h.extra && h.extra.buyer) === norm(buyer)) : [];
    const dupPlate = item.plate ? DB.history.filter(h => h.action === "return" && norm(h.plate) === norm(item.plate)) : [];

    if (dupByBuyer.length) {
      openModal("⚠️ هشدار: برگشت تکراری از این خریدار",
        `این خریدار (<b>${esc(buyer)}</b>) قبلاً ${dupByBuyer.length} بار موتور برگشتی ثبت کرده است.<br><br>` +
        `سابقه: ${dupByBuyer.map(h => `${esc(h.date)} — ${esc((h.extra && h.extra.returnReason) || "-")}`).join("<br>")}<br><br>آیا باز هم ثبت شود؟`,
        () => { doReturn(); }, "بله، ثبت کن");
      return;
    }
    if (dupPlate.length) {
      openModal("⚠️ هشدار: پلاک تکراری",
        `پلاک <b>${esc(item.plate)}</b> قبلاً ${dupPlate.length} بار در برگشتی‌ها ثبت شده است.<br><br>آیا باز هم ثبت شود؟`,
        () => { doReturn(); }, "بله، ثبت کن");
      return;
    }
    doReturn();
  }, "ثبت برگشتی", () => { if ($("ret_date")) buildJalaliPicker($("ret_date")); });
}

    // مقادیر جدید از فرم
    const nv = {
      company: $("e_company").value.trim(), name: $("e_name").value.trim(),
      group: $("e_group") ? $("e_group").value : it.group,
      volume: $("e_volume").value.trim(), type: $("e_type").value.trim(),
      color: $("e_color").value.trim(), year: $("e_year").value.trim(),
      chassis: $("e_chassis").value.trim(), engine: $("e_engine").value.trim(),
      plate: $("e_plate").value.trim(),
      price: Number($("e_price").value.replace(/[^\d]/g, "")) || 0,
      payStatus: $("e_payStatus").value,
      supplier: $("e_supplier").value.trim(), barname: $("e_barname").value.trim(), receiver: $("e_receiver").value.trim()
    };
    if (!branchLocked) nv.branch = $("e_branch").value;
    if (s.buyer) {
      nv["saleInfo.buyer"] = $("e_buyer").value.trim();
      nv["saleInfo.father"] = $("e_father").value.trim();
      nv["saleInfo.national"] = $("e_national").value.trim();
      nv["saleInfo.phone"] = $("e_phone").value.trim();
      nv["saleInfo.payStatus"] = $("e_paySale").value;
      nv["saleInfo.salePrice"] = Number($("e_salePrice").value.replace(/[^\d]/g, "")) || 0;
      nv["saleInfo.receipt"] = $("e_receipt").value.trim();
      nv["saleInfo.address"] = $("e_address").value.trim();
    }
    const newStatus = branchLocked ? it.status : $("e_status").value;

    // کارمند: ویرایش فقط به‌صورت درخواست برای تأیید مدیر ثبت می‌شود
    if (!canManage()) {
      const changes = {};
      for (const k in nv) {
        let from, to = nv[k];
        if (k.indexOf("saleInfo.") === 0) {
          const f = k.slice(9);
          from = s[f] != null ? String(s[f]) : "";
        } else {
          from = it[k] != null ? String(it[k]) : "";
        }
        if (String(from) !== String(to)) changes[k] = { from, to };
      }
      if (!Object.keys(changes).length) { closeModal(); toast("تغییری ثبت نشد"); return; }
      submitPendingEdit(it.id, changes, "ویرایش مشخصات");
      closeModal();
      return;
    }

    // مدیر: اعمال مستقیم
    it.company = nv.company; it.name = nv.name;
    if ($("e_group")) it.group = nv.group;
    it.volume = nv.volume; it.type = nv.type; it.color = nv.color; it.year = nv.year;
    it.chassis = nv.chassis; it.engine = nv.engine; it.plate = nv.plate;
    it.price = nv.price; it.payStatus = nv.payStatus;
    if (!branchLocked) it.branch = nv.branch;
    it.supplier = nv.supplier; it.barname = nv.barname; it.receiver = nv.receiver;
    if (s.buyer) {
      it.saleInfo = await buildSaleRecord(Object.assign({}, s, {
        buyer: nv["saleInfo.buyer"], father: nv["saleInfo.father"],
        national: nv["saleInfo.national"], phone: nv["saleInfo.phone"],
        payStatus: nv["saleInfo.payStatus"], salePrice: nv["saleInfo.salePrice"],
        receipt: nv["saleInfo.receipt"], address: nv["saleInfo.address"]
      }));
    }
    if (oldBranch !== it.branch) {
      pushHistory({ id: uid("h"), itemId: it.id, branch: it.branch, action: "status", fromStatus: null, toStatus: null, date: todayJalali(), note: `ویرایش: انتقال از ${oldBranch} به ${it.branch}`, by: userTag(), createdAt: new Date().toISOString() });
    }
    if (oldStatus !== newStatus) changeStatusInternal(it, newStatus, "تغییر وضعیت از طریق ویرایش");
    pushHistory({ id: uid("h"), itemId: it.id, branch: it.branch, action: "edit", fromStatus: it.status, toStatus: it.status, date: todayJalali(), note: `ویرایش اطلاعات توسط ${userTag()}`, by: userTag(), createdAt: new Date().toISOString() });
    save({ items: [it.id] }); closeModal(); toast("✅ ویرایش شد");
    renderCycle(); renderInventory(); renderDashboard(); renderBranchTabs();
  }, "ذخیره", () => { attachNumFmt($("modalMsg")); });
}

/* ==========================================================================
