function saveSettings() {
  const name = $("set_company").value.trim();
  const low = Math.max(0, +$("set_lowStock").value || 3);
  const bs = $("set_branches").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!bs.length) { toast("حداقل یک شعبه لازم است", false); return; }
  DB.settings.companyName = name; DB.settings.lowStock = low; DB.settings.branches = [...new Set(bs)];
  if (!DB.settings.branches.includes(activeBranch)) activeBranch = DB.settings.branches[0];
  save(); renderBranchTabs(); renderSettings(); toast("✅ تنظیمات ذخیره شد");
}
function renameBranch(old) {
  openModal("تغییر نام شعبه", `<div class="field"><label>نام جدید</label><input id="rb_name" value="${esc(old)}"></div>`, () => {
    const nn = $("rb_name").value.trim();
    if (!nn) return;
    const idx = DB.settings.branches.indexOf(old);
    if (idx >= 0) DB.settings.branches[idx] = nn;
    DB.items.forEach(i => { if (i.branch === old) i.branch = nn; });
    if (activeBranch === old) activeBranch = nn;
    save(); closeModal(); renderBranchTabs(); renderSettings(); toast("✅ نام شعبه تغییر کرد");
  }, "ذخیره", () => { const i = $("rb_name"); if (i) i.focus(); });
}
function removeBranch(b) {
  const used = DB.items.some(i => i.branch === b);
  if (used) { toast("این شعبه دارای داده است", false); return; }
  openModal("حذف شعبه", `شعبه <b>${esc(b)}</b> حذف شود؟`, () => {
    DB.settings.branches = DB.settings.branches.filter(x => x !== b);
    if (activeBranch === b) activeBranch = DB.settings.branches[0];
    save(); closeModal(); renderBranchTabs(); renderSettings(); toast("🗑️ حذف شد");
  }, "حذف");
}

/* ==========================================================================
   پشتیبان
   ========================================================================== */
function exportData() {
  if (!canManage()) { toast("فقط مدیر می‌تواند پشتیبان کامل بگیرد", false); return; }
  downloadJSON(`moto-backup-${todayJalali().replace(/\//g, "-")}.json`, DB);
  logActivity("پشتیبان‌گیری", "دانلود فایل پشتیبان");
  save(); toast("✅ فایل پشتیبان دانلود شد");
}
function exportAllCSV() {
  if (!canManage()) { toast("فقط مدیر", false); return; }
  const zip = [];
  zip.push("=== موتورها ===");
  zip.push(toCSV([["شعبه", "شرکت", "نام", "شاسی", "پلاک", "قیمت خرید", "قیمت فروش", "وضعیت", "تاریخ ورود", "خریدار"],
    ...DB.items.map(i => [i.branch, i.company, i.name, i.chassis, i.plate, i.price, (i.saleInfo && i.saleInfo.salePrice) || "", i.status, i.dateIn, (i.saleInfo && i.saleInfo.buyer) || ""])]));
  zip.push("\n=== تاریخچه ===");
  zip.push(toCSV([["تاریخ", "شعبه", "از", "به", "توضیح"],
    ...DB.history.map(h => [h.date, h.branch, h.fromStatus || "", h.toStatus || "", h.note])]));
  const blob = new Blob(["\uFEFF" + zip.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `moto-alldata-${todayJalali().replace(/\//g, "-")}.csv`;
  a.click();
  toast("✅ دانلود شد");
}
function importData(ev) {
  if (!canManage()) { toast("فقط مدیر", false); ev.target.value = ""; return; }
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.items || !d.history) throw new Error("bad");
      openModal("بازگردانی", `فایل شامل <b>${d.items.length}</b> موتور است. داده‌های فعلی جایگزین می‌شوند. ادامه؟`, () => {
        DB = { items: d.items || [], history: d.history || [], activity: d.activity || [], settings: Object.assign({}, DEFAULT_SETTINGS, d.settings || {}) };
        save(); closeModal(); toast("✅ بازگردانی شد"); setTimeout(() => location.reload(), 700);
      }, "بازگردانی");
    } catch (err) { toast("❌ فایل نامعتبر است", false); }
    ev.target.value = "";
  };
  r.readAsText(f);
}
function resetAll() {
  openModal("⚠️ پاک کردن همه داده‌ها", "همه موتورها و تاریخچه <b>برای همیشه</b> پاک می‌شوند. مطمئن هستید؟<br><br>پیشنهاد: ابتدا پشتیبان بگیرید.", () => {
    DB = { items: [], history: [], activity: [], settings: { ...DEFAULT_SETTINGS } };
    activeBranch = DB.settings.branches[0];
    save(); closeModal(); toast("🗑️ همه داده‌ها پاک شد"); setTimeout(() => location.reload(), 700);
  }, "پاک کن");
}
function renderStorageInfo() {
  const bytes = new Blob([JSON.stringify(DB)]).size;
  const kb = (bytes / 1024).toFixed(1);
  const fsStatus = fileHandle ? "✅ متصل — ذخیره خودکار فعال" : "⚠️ متصل نیست — داده فقط در مرورگر";
  $("storageInfo").innerHTML = `<div class="kpi-mini">
    <div><b>${DB.items.length}</b>موتور</div>
    <div><b>${DB.history.length}</b>رخداد</div>
    <div><b>${DB.activity.length}</b>فعالیت</div>
    <div><b>${kb} KB</b>حجم داده</div>
    <div style="grid-column:1/-1;"><b>${fsStatus}</b>وضعیت فایل امن</div></div>`;
}
function loadDemo() {
  openModal("داده نمونه", "داده‌های نمایشی به انبار اضافه شود؟ (داده‌های فعلی حفظ می‌شوند)", () => {
    closeModal(); seedDemo(); toast("✅ داده نمونه اضافه شد");
    renderBranchTabs(); renderDashboard(); save();
  }, "افزودن");
}

  const names = ["CGL 125", "دینو ۲۰۰", "پالس ۲۰۰", "آریا ۱۵۰"];
  const colors = ["مشکی", "سفید", "قرمز", "آبی"];
  branches().slice(0, 3).forEach((b, bi) => {
    for (let i = 0; i < 3; i++) {
      const chassis = `DEMO${bi}${i}${Math.floor(Math.random() * 9000 + 1000)}`;
      DB.items.push({
        id: uid("it"), branch: b, company: companies[(bi + i) % companies.length],
        name: names[(bi + i) % names.length], volume: "125cc", type: "اسپرت",
        color: colors[i % colors.length], year: "1402", chassis, engine: "",
        plate: "", plateSerial: "", price: 300000000 + i * 20000000,
        payStatus: "نقدی", specs: "", note: "داده نمونه", supplier: "نمایشی",
        supplierPhone: "", barname: "DEMO-" + i, receiver: "مدیر", dateIn: todayJalali(),
        status: STATUS.IN, saleInfo: null, exitInfo: null, warranty: null, createdAt: new Date().toISOString()
      });
    }
  });
}

   میان‌برها

function openShortcuts() {
  openModal("⌨️ میان‌برهای صفحه‌کلید", `
    <div class="info-grid" style="grid-template-columns:1fr;">
      <div><b>Ctrl + S</b> — ذخیره داده‌ها</div>
      <div><b>Ctrl + P</b> — چاپ صفحه فعلی</div>
      <div><b>Ctrl + Enter</b> — تایید مودال باز</div>
      <div><b>Esc</b> — بستن مودال</div>
      <div><b>Alt + 1..9</b> — جابه‌جایی سریع بین تب‌ها</div>
    </div>`, null);
}
const TAB_ORDER = ["dash", "in", "out", "cycle", "inv", "report", "log", "settings", "backup"];
document.addEventListener("keydown", e => {
  if (e.altKey && !e.ctrlKey) {
    const n = parseInt(e.key);
    if (n >= 1 && n <= TAB_ORDER.length) {
      const b = document.querySelector(`#mainNav button[data-tab="${TAB_ORDER[n - 1]}"]`);
      if (b) { e.preventDefault(); b.click(); }
    }
  }
  if (e.ctrlKey && e.key === "Enter") {
    const activeTab = document.querySelector("#mainNav button.active").dataset.tab;
    if (activeTab === "in") { e.preventDefault(); addEntry(); }
    if (activeTab === "out") { e.preventDefault(); addExit(); }
  }
});

/* ==========================================================================
   فرم‌ها: پاک کردن
   ========================================================================== */
function clearForm(prefix) {
  const ids = {
    in: ["in_barname", "in_supplier", "in_supplier_phone", "in_receiver", "in_company", "in_name", "in_volume", "in_type", "in_color", "in_year", "in_chassis", "in_engine", "in_plate", "in_plateSerial", "in_price", "in_prepay", "in_specs", "in_note"],
    out: ["out_receipt", "out_buyer", "out_father", "out_national", "out_birth", "out_phone", "out_price", "out_discount", "out_tradeIn", "out_address", "out_note", "out_itemSearch"]
  };
  (ids[prefix] || []).forEach(id => { const el = $(id); if (el) { el.value = ""; el.dataset.raw = ""; } });
  if (prefix === "in") { $("in_qty").value = 1; $("in_date").value = todayJalali(); }
  if (prefix === "out") { $("out_date").value = todayJalali(); $("out_item").selectedIndex = 0; }
  clearErrs(prefix === "in" ? $("inForm") : $("outForm"));
}

/* ==========================================================================
   راه‌اندازی
   ========================================================================== */
function bindLiveInputs() {
  const live = (id, fn) => { const el = $(id); if (el) el.addEventListener("input", fn); };
  live("inv_q", renderInventory);
  live("inv_status", renderInventory);
  live("inv_company", renderInventory);
  live("inv_sort", renderInventory);
  live("cyc_q", renderCycle);
  live("cyc_status", renderCycle);
  live("log_q", renderLog);
}

async function boot() {
  load();
  applyTheme();
  buildPanels();
  buildForms();
  setupNav();
  bindLiveInputs();
  attachNumFmt(document);
  document.querySelectorAll(".dp-input").forEach(buildJalaliPicker);

  $("in_date").value = todayJalali();
  $("out_date").value = todayJalali();

  toggleOutType();
  populateDatalists();
  renderBranchTabs();
  renderDashboard();

  await initFileStorage();

  // ذخیره خودکار قبل از بستن
  window.addEventListener("beforeunload", save);

  // کنترل ورود
  bootAuth();

  $("login_pass") && $("login_pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("setup_pass2") && $("setup_pass2").addEventListener("keydown", e => { if (e.key === "Enter") doSetupManager(); });
}
boot();
</script>
