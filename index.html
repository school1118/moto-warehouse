function historyCard(h, refItem) {
  const it = refItem || DB.items.find(i => i.id === h.itemId) || {};
  const sale = decryptSale(it.saleInfo || {}), exit = it.exitInfo || {};
  const customerLabel = sale.buyer ? `${sale.buyer} (${sale.buyerType || "مشتری"})` : (exit.to || "-");
  const extra = h.extra || {};
  return `<div class="history-item">
    <div>
      <span class="row-kv"><b>رخداد:</b> ${actionLabel(h.action)}</span>
      <span class="row-kv"><b>تاریخ:</b> ${esc(h.date) || "-"}</span>
      <span class="row-kv"><b>شعبه:</b> ${esc(h.branch) || esc(it.branch) || "-"}</span>
      <span class="row-kv"><b>از→به:</b> ${esc(h.fromStatus) || "-"} → ${esc(h.toStatus) || "-"}</span>
      ${h.by ? `<span class="row-kv"><b>کاربر:</b> ${esc(h.by)}</span>` : ""}
    </div>
    <div>
      <span class="row-kv"><b>موتور:</b> ${esc(it.company) || "-"} ${esc(it.name) || ""}</span>
      <span class="row-kv"><b>شاسی:</b> ${esc(it.chassis) || "-"}</span>
      <span class="row-kv"><b>پلاک:</b> ${esc(it.plate) || "-"}</span>
      <span class="row-kv"><b>مشتری/همکار:</b> ${esc(extra.buyer || customerLabel) || "-"}</span>
      ${extra.returnReason ? `<span class="row-kv"><b>دلیل برگشت:</b> ${esc(extra.returnReason)}</span>` : ""}
    </div>
    <div class="meta">${esc(h.note) || ""}</div>
  </div>`;
}
function actionLabel(a) {
  return { in: "📥 ورود", sale: "💰 فروش", transfer: "🔀 انتقال", return: "🔄 برگشتی", status: "🔄 تغییر وضعیت", edit: "✏️ ویرایش", reserve: "🔖 رزرو", exit: "📤 خروج", delete: "🗑️ حذف", restore: "♻️ بازگردانی", archive: "📦 آرشیو" }[a] || a;
}
function statusBadge(s) {
  const map = { "موجود": "b-in", "رزرو": "b-trust", "فروش": "b-sale", "خروج": "b-out", "برگشتی": "b-return" };
  return `<span class="badge ${map[s] || ""}">${esc(s)}</span>`;
}
function payBadge(s) {
  const map = { "نقدی": "b-cash", "چکی": "b-check", "اقساطی": "b-inst", "چک": "b-check", "اقساط": "b-inst", "چکی اقساطی": "b-inst", "معاوضه": "b-transfer", "امانی": "b-trust" };
  return `<span class="badge ${map[s] || ""}">${esc(s)}</span>`;
}
function showHistory(itemId) {
  const item = DB.items.find(i => i.id === itemId);
  const hist = DB.history.filter(h => h.itemId === itemId).sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
  const ref = item || (hist[0] ? Object.assign({ branch: hist[0].branch }, (hist.find(h => h.plate) || {})) : {});
  const head = item ? `<div class="info-grid">
    <div><b>نام موتور:</b> ${esc(item.company)} ${esc(item.name)}</div>
    <div><b>شاسی:</b> ${esc(item.chassis) || "-"}</div>
    <div><b>موتور:</b> ${esc(item.engine) || "-"}</div>
    <div><b>پلاک:</b> ${esc(item.plate) || "-"}</div>
    <div><b>رنگ:</b> ${esc(item.color) || "-"}</div>
    <div><b>شعبه فعلی:</b> ${esc(item.branch)}</div>
    <div><b>تامین‌کننده:</b> ${esc(item.supplier) || "-"}</div>
    <div><b>بارنامه:</b> ${esc(item.barname) || "-"}</div>
    <div><b>قیمت خرید:</b> ${money(item.price)}</div>
    <div><b>وضعیت فعلی:</b> ${statusBadge(item.status)}</div>
    ${item.returnCount ? `<div><b>تعداد برگشتی:</b> ${item.returnCount} بار</div>` : ""}
    ${item.createdBy ? `<div><b>ثبت‌کننده:</b> ${esc(item.createdBy)}</div>` : ""}
  </div>` : `<div class="alert red">🗑️ این موتور حذف شده است، اما تاریخچه آن برای همیشه حفظ شده.</div>`;
  const body = hist.length ? hist.map(h => historyCard(h, item)).join("") : '<div class="empty">تاریخچه‌ای ثبت نشده</div>';
  openModal(`📜 تاریخچه: ${esc((item && item.company) || "")} ${esc((item && item.name) || "")}`, head + body, null);
}
/* آرشیو کامل تاریخچه همه موتورها (شامل حذف‌شده‌ها) */
function openHistoryArchive() {
  const q = "";
  const hist = [...DB.history].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const byAction = {};
  hist.forEach(h => { byAction[h.action] = (byAction[h.action] || 0) + 1; });
  const stats = Object.entries(byAction).map(([a, n]) => `<span class="badge b-in">${actionLabel(a)}: ${n}</span>`).join(" ");
  const body = hist.length
    ? hist.slice(0, 500).map(h => historyCard(h)).join("")

     <p class="helper">همه رخدادها (ورود، رزرو، فروش، خروج، برگشتی، ویرایش، حذف) برای همیشه در سرور حفظ می‌شوند. ${hist.length > 500 ? "۵۰۰ مورد آخر نمایش داده می‌شود." : ""}</p>
     ${body}`, null);
}

/* ==========================================================================
   حذف
   ========================================================================== */
function deleteItem(itemId) {
  if (!canManage()) { toast("فقط مدیر می‌تواند موتور حذف کند", false); return; }
  const it = DB.items.find(i => i.id === itemId);
  if (!it) return;
  openModal("حذف موتور", `آیا موتور <b>${esc(it.company)} ${esc(it.name)}</b> (شاسی: ${esc(it.chassis) || "-"}) از لیست فعال حذف شود؟<br><span style="color:#2a5298;">✅ اطلاعات کامل آن روی سرور باقی می‌ماند و در «بایگانی و حذف‌شده‌ها» قابل مشاهده و بازگردانی است.</span>`, () => {
    it.deleted = true;
    it.deletedAt = new Date().toISOString();
    it.deletedBy = userTag();
    pushHistory({ itemId, branch: it.branch, action: "delete", fromStatus: it.status, toStatus: null, date: todayJalali(), note: `حذف موتور ${it.company} ${it.name} توسط ${userTag()} (قابل بازگردانی)`, by: userTag() });
    save({ items: [itemId] });
    closeModal(); toast("🗑️ حذف شد — در بایگانی قابل بازگردانی است");
    renderInventory(); renderCycle(); renderDashboard(); renderBranchTabs();
  }, "حذف");
}
/* بازگردانی موتور حذف‌شده */
function restoreItem(itemId) {
  if (!canManage()) { toast("فقط مدیر", false); return; }
  const it = DB.items.find(i => i.id === itemId);
  if (!it) return;
  it.deleted = false; it.deletedAt = null; it.deletedBy = null;
  pushHistory({ itemId, branch: it.branch, action: "restore", fromStatus: it.status, toStatus: it.status, date: todayJalali(), note: `بازگردانی موتور توسط ${userTag()}`, by: userTag() });
  save({ items: [itemId] });
  toast("♻️ موتور بازگردانی شد");
  renderInventory(); renderCycle(); renderDashboard(); renderBranchTabs();
  if (typeof renderArchive === "function") renderArchive();
}
/* آرشیو دستی موتور */
function archiveItem(itemId) {
  const it = DB.items.find(i => i.id === itemId);
  if (!it) return;
  it.archived = true; it.archivedAt = new Date().toISOString();
  pushHistory({ itemId, branch: it.branch, action: "archive", fromStatus: it.status, toStatus: it.status, date: todayJalali(), note: `آرشیو موتور توسط ${userTag()}`, by: userTag() });
  save({ items: [itemId] });
  toast("📦 موتور آرشیو شد");
  renderInventory(); renderCycle(); renderDashboard();
  if (typeof renderArchive === "function") renderArchive();
}
function unarchiveItem(itemId) {
  const it = DB.items.find(i => i.id === itemId);
  if (!it) return;
  it.archived = false; it.archivedAt = null;
  save({ items: [itemId] });
  toast("♻️ از آرشیو خارج شد");
  if (typeof renderArchive === "function") renderArchive();
  renderInventory(); renderDashboard();
}

function resetInvFilters() {
  $("inv_q").value = ""; $("inv_status").value = ""; $("inv_company").value = ""; $("inv_sort").value = "";
  renderInventory();
}
function renderInventory() {
  const q = ($("inv_q") ? $("inv_q").value : "").trim();
  const fStatus = $("inv_status") ? $("inv_status").value : "";
  const fCompany = $("inv_company") ? $("inv_company").value : "";
  const sortSel = $("inv_sort") ? $("inv_sort").value : "";
  const tab = uiState.invTab;

  const companies = [...new Set(DB.items.map(i => i.company).filter(Boolean))].sort();
  const cSel = $("inv_company");
  if (cSel) cSel.innerHTML = '<option value="">همه</option>' + companies.map(c => `<option ${c === fCompany ? "selected" : ""}>${esc(c)}</option>`).join("");

  // تب ارزش‌گذاری
  if (tab === "value") { renderInvValue(); return; }
  if (tab === "age") { renderInvAge(); return; }
  $("invToolbar").style.display = "flex";

  let rows = itemsForActiveBranch().filter(en => {
    if (tab === "active" && en.status !== STATUS.IN) return false;
    if (tab === "low" && en.status !== STATUS.IN) return false;
    if (fStatus && en.status !== fStatus) return false;
    if (fCompany && en.company !== fCompany) return false;
    return globalSearch(en, q);
  });

  if (tab === "low") {
    const groups = {};
    rows.forEach(r => { const k = r.company + "|" + r.name; groups[k] = (groups[k] || 0) + 1; });
    const lowKeys = new Set(Object.keys(groups).filter(k => groups[k] <= (DB.settings.lowStock || 3)));
    rows = rows.filter(r => lowKeys.has(r.company + "|" + r.name));
  }

  if (sortSel === "price_desc") rows.sort((a, b) => (b.price || 0) - (a.price || 0));
  else if (sortSel === "price_asc") rows.sort((a, b) => (a.price || 0) - (b.price || 0));
  else if (sortSel === "name") rows.sort((a, b) => (a.name || "").localeCompare(b.name || "", "fa"));
  else if (sortSel === "date_desc") rows.sort((a, b) => jalaliToISO(b.dateIn).localeCompare(jalaliToISO(a.dateIn)));
  else rows = sortRows(rows, uiState.sort.inv);

  const totalVal = rows.reduce((s, r) => s + (r.price || 0), 0);
  const totalCount = rows.length;
  const pg = paginate(rows, "inv");
  rows = pg.pageRows;
  $("invCount").textContent = `${totalCount} قلم — ارزش خرید: ${money(totalVal)} ${DB.settings.currency} — صفحه ${pg.cur} از ${pg.pages}`;

  if (!totalCount) { $("invTable").innerHTML = '<div class="empty">موردی یافت نشد</div>'; return; }

  const cols = getCols("inv");
  const cellVal = (en, k) => {
    switch (k) {
      case "price": return money(en.price);
      case "status": return statusBadge(en.status);
      case "group": return en.group ? `<span class="badge b-in">${esc(groupLabel(en.group))}</span>` : "-";
      case "dateIn": return esc(en.dateIn) || "-";
      case "chassis": case "engine": return `<span style="font-size:10px;direction:ltr;">${esc(en[k]) || "-"}</span>`;
      case "plate": return `<span style="direction:ltr;">${esc(en.plate) || "-"}</span>`;
      default: return esc(en[k]) || "-";
    }
  };
  $("invTable").innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr>
      <th class="no-sort">#</th>
      ${cols.map(c => `<th class="no-sort">${esc(c.label)}</th>`).join("")}
      <th class="no-sort">عملیات</th>
    </tr></thead><tbody>` +
    rows.map((en, i) => `<tr>
      <td>${pg.from + i + 1}</td>
      ${cols.map(c => `<td>${cellVal(en, c.k)}</td>`).join("")}
      <td style="white-space:nowrap;">
        <button class="btn small success" onclick="editItem('${en.id}')">✏️</button>
        <button class="btn small" onclick="showHistory('${en.id}')">📜</button>
        <button class="btn small" onclick="archiveItem('${en.id}')" title="آرشیو">📦</button>
        ${canManage() ? `<button class="btn small danger" onclick="deleteItem('${en.id}')">🗑️</button>` : ""}
      </td>
    </tr>`).join("") + "</tbody></table></div>" + pg.bar;
}

function renderInvAge() {
  const items = itemsForActiveBranch().filter(i => i.status === STATUS.IN);
  const buckets = [
    { label: "۰–۳۰ روز", min: 0, max: 30 },
    { label: "۳۱–۶۰ روز", min: 31, max: 60 },
    { label: "۶۱–۹۰ روز", min: 61, max: 90 },
    { label: "بیش از ۹۰ روز", min: 91, max: Infinity }
  ];
  const withAge = items.map(i => ({ it: i, age: -daysUntil(i.dateIn) || 0 }));
  const counts = buckets.map(b => withAge.filter(x => x.age >= b.min && x.age <= b.max).length);
  const total = withAge.length || 1;
  const stale = withAge.filter(x => x.age > 90).sort((a, b) => b.age - a.age);
  $("invToolbar").style.display = "none";
  $("invCount").textContent = "";
  $("invTable").innerHTML = `
    <div class="kpi-mini" style="margin-top:12px;">
      <div><b>${withAge.length}</b>موتور موجود</div>
      <div><b>${withAge.length ? Math.round(withAge.reduce((s, x) => s + x.age, 0) / withAge.length) : 0}</b>میانگین عمر (روز)</div>
      <div><b>${stale.length}</b>بیش از ۹۰ روز</div>
    </div>
    <h3>⏳ توزیع عمر موجودی</h3>
    <div style="overflow-x:auto;"><table><thead><tr><th>بازه</th><th>تعداد</th><th>سهم</th><th>نمودار</th></tr></thead><tbody>
    ${buckets.map((b, i) => `<tr><td>${b.label}</td><td>${counts[i]}</td><td>${Math.round(counts[i] / total * 100)}%</td>
      <td><div class="bar"><span style="width:${Math.round(counts[i] / total * 100)}%"></span></div></td></tr>`).join("")}
    </tbody></table></div>
    <h3>⚠️ موتورهای خواب‌مانده (بیش از ۹۰ روز)</h3>
    ${stale.length ? `<div style="overflow-x:auto;"><table><thead><tr><th>شعبه</th><th>شرکت/نام</th><th>شاسی</th><th>رنگ</th><th>قیمت خرید</th><th>تاریخ ورود</th><th>عمر (روز)</th></tr></thead><tbody>
    ${stale.map(x => `<tr><td>${esc(x.it.branch)}</td><td>${esc(x.it.company)} ${esc(x.it.name)}</td>
      <td style="direction:ltr;">${esc(x.it.chassis) || "-"}</td><td>${esc(x.it.color) || "-"}</td>
      <td>${money(x.it.price)}</td><td>${esc(x.it.dateIn)}</td>
      <td><b class="neg">${x.age}</b></td></tr>`).join("")}
    </tbody></table></div>` : '<div class="empty">موتور خواب‌مانده‌ای وجود ندارد 👌</div>'}
    <div class="actions"><button class="btn gray" onclick="printSection()">🖨️ چاپ</button></div>`;
}

function renderInvValue() {
  const items = itemsForActiveBranch().filter(i => i.status === STATUS.IN);

  });

  $("invTable").innerHTML = `
    <div class="kpi-mini" style="margin-top:12px;">
      <div><b>${items.length}</b> موتور موجود</div>
      <div><b>${money(totalVal)}</b>ارزش کل (${DB.settings.currency})</div>

function renderDashboard() {
  const items = itemsForActiveBranch();
  const total = items.length;
  const inStock = items.filter(i => i.status === STATUS.IN).length;
  const saleCount = items.filter(i => i.status === STATUS.SALE).length;
  const outCount = items.filter(i => i.status === STATUS.OUT).length;
  const returnCount = items.filter(i => i.status === STATUS.RETURN).length;
  const reserved = items.filter(i => i.status === STATUS.RESERVED).length;
  const totalSales = items.filter(i => i.saleInfo).reduce((s, i) => s + (i.saleInfo.salePrice || 0) - (i.saleInfo.discount || 0), 0);
  const totalBuys = items.reduce((s, i) => s + (i.price || 0), 0);

  $("headerStats").textContent = isManager()
    ? `👔 مدیر مرکزی | موجود: ${inStock} | کل موتورها: ${total}`
    : `🏢 ${activeBranch} | موجود: ${inStock} | کل: ${total}`;

  $("dashCards").innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">🏍️ کل موتورها</div></div>
    <div class="stat-card green"><div class="num">${inStock}</div><div class="lbl">📦 موجود</div></div>
    <div class="stat-card purple"><div class="num">${reserved}</div><div class="lbl">🔒 رزرو</div></div>
    <div class="stat-card orange"><div class="num">${saleCount}</div><div class="lbl">💰 فروش</div></div>
    <div class="stat-card red"><div class="num">${outCount}</div><div class="lbl">📤 خروج</div></div>
    <div class="stat-card"><div class="num">${returnCount}</div><div class="lbl">🔄 برگشتی</div></div>
    <div class="stat-card green"><div class="num">${money(totalSales)}</div><div class="lbl">💵 مجموع فروش</div></div>
    <div class="stat-card orange"><div class="num">${money(totalBuys)}</div><div class="lbl">🛒 مجموع خرید</div></div>`;

  // هشدارها
  const alerts = [];
  const lowGroups = {};
  items.filter(i => i.status === STATUS.IN).forEach(i => { const k = i.company + "|" + i.name; lowGroups[k] = (lowGroups[k] || 0) + 1; });
  const lows = Object.entries(lowGroups).filter(([, c]) => c <= (DB.settings.lowStock || 3));
  if (lows.length) alerts.push(`<div class="alert red">⚠️ <b>${lows.length} مدل</b> موجودی کم دارد: ${lows.map(([k, c]) => `${esc(k.split("|").join(" "))} (${c})`).join("، ")}</div>`);
  // هشدار گروه‌های کم‌موجود
  const gWarns = groupsStatus().filter(x => x.state === "low" || x.state === "empty");
  if (gWarns.length) alerts.push(`<div class="alert red">🧩 <b>هشدار گروه‌ها:</b> ${gWarns.map(x => `${esc(x.g.label)} (${x.count}/${x.g.min})`).join("، ")}</div>`);
  $("dashAlerts").innerHTML = alerts.join("");
  renderGroupCards();

  renderSalesChart(items);
  renderBranchCards();
  renderTopModels(items);

  let recent;
  if (isManager()) recent = [...DB.history].slice(-10).reverse();
  else recent = DB.history.filter(h => h.branch === activeBranch).slice(-10).reverse();
  $("recentLog").innerHTML = recent.length ? recent.map(h => historyCard(h)).join("") : '<div class="empty">رخدادی ثبت نشده</div>';
  if (typeof checkGroupAlerts === "function") checkGroupAlerts();
}

function renderGroupCards() {
  const el = $("groupCards"); if (!el) return;
  const st = groupsStatus();
  el.innerHTML = st.map(x => {
    const cls = x.state === "empty" ? "red" : x.state === "low" ? "orange" : x.state === "high" ? "purple" : "green";
    const badge = x.state === "empty" ? "🔴 تمام‌شده" : x.state === "low" ? "⚠️ کم" : x.state === "high" ? "↑ سقف" : "✅";

function renderBranchCards() {
  $("branchCards").innerHTML = branches().map(b => {
    const c = DB.items.filter(i => i.branch === b && i.status === STATUS.IN).length;
    const val = DB.items.filter(i => i.branch === b && i.status === STATUS.IN).reduce((s, i) => s + (i.price || 0), 0);

function renderTopModels(items) {
  const groups = {};
  items.forEach(i => {
    const k = i.company + " " + i.name;
    if (!groups[k]) groups[k] = { sold: 0, revenue: 0, stock: 0 };
  });
  // فروش‌ها
  items.filter(i => i.saleInfo).forEach(i => {
    const k = i.company + " " + i.name;
    groups[k].sold++;
    groups[k].revenue += (i.saleInfo.salePrice || 0);
  });
  items.filter(i => i.status === STATUS.IN).forEach(i => { const k = i.company + " " + i.name; if (groups[k]) groups[k].stock++; });
  const arr = Object.entries(groups).sort((a, b) => b[1].sold - a[1].sold || b[1].revenue - a[1].revenue).slice(0, 6);
  const maxS = Math.max(1, ...arr.map(([, v]) => v.sold));
  $("topModels").innerHTML = arr.length ? `<table><thead><tr><th>مدل</th><th>تعداد فروش</th><th>درآمد</th><th>موجود</th><th>نمودار</th></tr></thead><tbody>
    ${arr.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.sold}</td><td>${money(v.revenue)}</td><td>${v.stock}</td>
      <td><div class="bar"><span style="width:${Math.round(v.sold / maxS * 100)}%"></span></div></td></tr>`).join("")}
    </tbody></table>` : '<div class="empty">داده‌ای نیست</div>';
}

function renderSalesChart(items) {
  const months = [];
  let [jy, jm] = todayJalali().split("/").map(Number);
  for (let i = 5; i >= 0; i--) {
    let m = jm - i, y = jy;
    while (m < 1) { m += 12; y--; }
    months.push(`${y}/${String(m).padStart(2, "0")}`);
  }
  const counts = months.map(() => 0), revs = months.map(() => 0);
  items.filter(i => i.saleInfo).forEach(i => {
    const d = (i.saleInfo.date || "").slice(0, 7);
    const idx = months.indexOf(d);
    if (idx >= 0) { counts[idx]++; revs[idx] += (i.saleInfo.salePrice || 0); }
  });
  const max = Math.max(1, ...counts);
  $("salesChart").innerHTML = `<div style="display:flex;gap:8px;align-items:flex-end;height:150px;padding:10px;background:#f8fafd;border-radius:8px;">
    ${months.map((m, i) => {
      const h = Math.round(counts[i] / max * 120);
      return `<div style="flex:1;text-align:center;">
        <div style="font-size:10px;color:#2a5298;font-weight:700;">${counts[i]}</div>
        <div style="height:${h}px;background:linear-gradient(180deg,#2a5298,#27ae60);border-radius:6px 6px 0 0;min-height:3px;" title="${money(revs[i])} تومان"></div>
        <div style="font-size:10px;color:#888;margin-top:4px;">${FA_MONTHS[Number(m.slice(5)) - 1].slice(0, 4)}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderArchive() {
  const tab = uiState.arcTab || "archived";
  const q = ($("arc_q") ? $("arc_q").value : "").trim();
  const base = tab === "deleted" ? branchScoped(deletedItems()) : branchScoped(archivedItems());
  const rows = base.filter(i => globalSearch(i, q));

  const totalCount = rows.length;
  const pg = paginate(rows, tab === "deleted" ? "del" : "archive");
  const pageRows = pg.pageRows;
  $("arcCount").textContent = `${totalCount} مورد — صفحه ${pg.cur} از ${pg.pages}`;
  if (!totalCount) { $("arcTable").innerHTML = '<div class="empty">موردی یافت نشد</div>'; return; }

  const cols = getCols("cyc");
  const cellVal = (it, k, s) => {
    switch (k) {
      case "status": return statusBadge(it.status);
      case "group": return it.group ? `<span class="badge b-in">${esc(groupLabel(it.group))}</span>` : "-";
      case "buyer": return esc(s.buyer) || "-";
      case "national": return `<span style="font-size:10px;direction:ltr;">${maskNational(s.national)}</span>`;
      case "phone": return `<span style="direction:ltr;">${esc(s.phone) || "-"}</span>`;
      case "payStatus": return s.payStatus ? payBadge(s.payStatus) : "-";
      case "salePrice": return money(s.salePrice);
      case "receipt": return esc(s.receipt) || "-";
      case "saleDate": return esc(it.saleDate || s.date) || "-";
      case "engine": case "chassis": return `<span style="font-size:10px;direction:ltr;">${esc(it[k]) || "-"}</span>`;
      case "plate": return `<span style="direction:ltr;">${esc(it.plate) || "-"}</span>`;
      case "returnCount": return it.returnCount ? `<span class="badge b-return">${it.returnCount} بار</span>` : "-";
      case "company": return `<b>${esc(it.company)}</b>`;
      default: return esc(it[k]) || "-";
    }
  };

  $("arcTable").innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr>
      ${cols.map(c => `<th class="no-sort">${esc(c.label)}</th>`).join("")}
      <th class="no-sort">وضعیت بایگانی</th>
      <th class="no-sort">عملیات</th>
    </tr></thead><tbody>` +
    pageRows.map(it => {
      const s = decryptSale(it.saleInfo || {});
      const badge = tab === "deleted"
        ? `<span class="badge b-out">حذف: ${esc((it.deletedAt || "").slice(0, 10))}</span>`
        : `<span class="badge b-return">آرشیو: ${esc((it.archivedAt || "").slice(0, 10))}</span>`;
      return `<tr>
        ${cols.map(c => `<td>${cellVal(it, c.k, s)}</td>`).join("")}
        <td>${badge}</td>
        <td style="white-space:nowrap;">
          <button class="btn small" onclick="showHistory('${it.id}')">📜</button>
          ${canManage() ? `<button class="btn small success" onclick="${tab === "deleted" ? "restoreItem" : "unarchiveItem"}('${it.id}'); renderArchive();">♻️ بازگردانی</button>` : ""}
        </td>
      </tr>`;
    }).join("") + "</tbody></table></div>" + pg.bar;
}

/* ==========================================================================
   تأیید ویرایش کارمندان (Workflow)
   کارمند ویرایش را پیشنهاد می‌دهد → مدیر تأیید/رد می‌کند.
   ========================================================================== */
function pendingList() {
  if (!DB.settings.pendingEdits) DB.settings.pendingEdits = [];
  return DB.settings.pendingEdits;
}
function submitPendingEdit(itemId, changes, label) {
  const it = DB.items.find(i => i.id === itemId);
  if (!it) return;
  const rec = {
    id: uid("pe"),
    itemId,
    branch: it.branch,
    itemName: `${it.company || ""} ${it.name || ""}`.trim(),
    label: label || "ویرایش",
    changes,                 // { field: {from, to} }
    by: currentUser ? currentUser.username : "-",
    at: new Date().toISOString()
  };
  pendingList().push(rec);
  save();
  toast("📨 درخواست ویرایش برای تأیید مدیر ارسال شد");
}
function applyPendingEdit(rec) {
  const it = DB.items.find(i => i.id === rec.itemId);
  if (!it) { toast("موتور یافت نشد", false); return; }
  for (const k in rec.changes) {
    const ch = rec.changes[k];
    if (k.indexOf("saleInfo.") === 0) {
      it.saleInfo = it.saleInfo || {};
      it.saleInfo[k.slice(9)] = ch.to;
    } else {
      it[k] = ch.to;
    }
  }
  save({ items: [it.id] });
  pushHistory({ itemId: it.id, branch: it.branch, action: "edit", fromStatus: it.status, toStatus: it.status, date: todayJalali(), note: `تأیید ویرایش توسط مدیر (${rec.by})`, by: userTag() });
}
function approvePending(id) {
  if (!canManage()) { toast("فقط مدیر", false); return; }
  const list = pendingList();
  const rec = list.find(r => r.id === id);
  if (!rec) return;
  applyPendingEdit(rec);
  DB.settings.pendingEdits = list.filter(r => r.id !== id);
  save();
  renderSettings(); renderCycle(); renderInventory(); renderDashboard();
  toast("✅ ویرایش تأیید و اعمال شد");
}
function rejectPending(id) {
  if (!canManage()) { toast("فقط مدیر", false); return; }
  DB.settings.pendingEdits = pendingList().filter(r => r.id !== id);
  save();
  renderSettings();
  toast("❌ درخواست رد شد");
}
function renderPending() {
  const el = $("pendingManage"); if (!el) return;
  const list = pendingList();
  const cnt = $("pendCount"); if (cnt) cnt.textContent = list.length ? `(${list.length} در انتظار)` : "(خالی)";
  if (!list.length) { el.innerHTML = '<div class="empty">درخواستی در انتظار تأیید نیست</div>'; return; }
  el.innerHTML = list.map(r => {
    const changes = Object.keys(r.changes).map(k => {
      const c = r.changes[k];
      const f = k.replace("saleInfo.", "");
      return `<div style="font-size:12.5px;margin:2px 0;"><b>${esc(colFa(f))}</b>: <span style="color:#c0392b;text-decoration:line-through;">${esc(c.from) || "—"}</span> ← <span style="color:#27ae60;">${esc(c.to) || "—"}</span></div>`;
    }).join("");
    return `<div class="card" style="border-right:4px solid #f59e0b;margin-bottom:8px;padding:10px 12px;">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center;">
        <div><b>${esc(r.itemName)}</b> <span class="helper">— توسط ${esc(r.by)} — ${esc(r.branch)}</span></div>
        <div>
          <button class="btn small success" onclick="approvePending('${r.id}')">✅ تأیید</button>
          <button class="btn small danger" onclick="rejectPending('${r.id}')">❌ رد</button>
        </div>
      </div>
      <div style="margin-top:6px;">${changes}</div>
    </div>`;
  }).join("");
}
function colFa(k) {
  const map = { company: "شرکت", name: "نام", volume: "حجم", type: "تیپ", color: "رنگ", year: "سال",
    chassis: "شاسی", engine: "موتور", plate: "پلاک", price: "قیمت خرید", supplier: "تامین‌کننده",
    barname: "بارنامه", receiver: "تحویل‌گیرنده", group: "گروه", buyer: "نام خریدار", father: "نام پدر",
    national: "کد ملی", phone: "تلفن", payStatus: "وضعیت فروش", salePrice: "قیمت فروش",

}

/* ============================ ۱) اصلاح موجودی ============================ */
function openStockAdjust(itemId) {
  if (!canManage()) { toast("فقط مدیر می‌تواند موجودی را اصلاح کند", false); return; }
  const it = DB.items.find(i => i.id === itemId);
  if (!it) return;
  const html = `
    <p class="helper">مقدار فعلی: <b>${esc(it.company)} ${esc(it.name)}</b> — وضعیت: ${statusBadge(it.status)}</p>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="field"><label>وضعیت جدید</label><select id="adj_status">${Object.values(STATUS).map(s => `<option ${it.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>تعداد اصلاح (±)</label><input id="adj_qty" type="number" value="0" style="direction:ltr;"></div>
    </div>
    <div class="field"><label>دلیل اصلاح *</label><textarea id="adj_reason" rows="2" placeholder="مثلاً: شمارش مجدد، مغایرت انبارگردانی، ایراد فنی..."></textarea></div>
    <div id="adj_err" class="login-err"></div>`;
  openModal("🔧 اصلاح موجودی", html, () => {
    const newStatus = $("adj_status").value;
    const dq = Number($("adj_qty").value) || 0;
    const reason = $("adj_reason").value.trim();
    if (!reason) { $("adj_err").textContent = "دلیل اصلاح الزامی است"; return; }
    const old = it.status;
    const note = `اصلاح موجودی: ${old} → ${newStatus}${dq ? ` (تعداد ${dq > 0 ? "+" : ""}${dq})` : ""} — دلیل: ${reason}`;
    changeStatusInternal(it, newStatus, note);
    pushHistory({ id: uid("h"), itemId: it.id, branch: it.branch, action: "adjust", fromStatus: old, toStatus: newStatus, date: todayJalali(), note, by: userTag(), extra: { reason, delta: dq } });
    save({ items: [it.id] });
    closeModal(); toast("✅ موجودی اصلاح شد");
    renderInventory(); renderCycle(); renderDashboard();
  }, "ثبت اصلاح");
}

/* ============================ ۲) انبارگردانی ============================ */
function openStocktake() {
  if (!canManage()) { toast("فقط مدیر", false); return; }
  const items = itemsForActiveBranch().filter(i => i.status === STATUS.IN || i.status === STATUS.RESERVED);
  const byModel = {};
  items.forEach(i => {
    const k = (i.company || "") + "|" + (i.name || "");
    byModel[k] = (byModel[k] || 0) + 1;
  });
  const keys = Object.keys(byModel).sort();
  if (!keys.length) { toast("موتوری برای شمارش وجود ندارد", false); return; }
  const html = `
    <p class="helper">تعداد واقعی هر مدل را وارد کنید. اختلاف با سیستم محاسبه و ثبت می‌شود.</p>
    <div style="max-height:400px;overflow:auto;">
    <table style="width:100%;font-size:13px;">
      <thead><tr><th style="text-align:right;">مدل</th><th>سیستم</th><th>شمارش‌شده</th><th>اختلاف</th></tr></thead>
      <tbody>
      ${keys.map((k, idx) => {
        const [c, n] = k.split("|");
        return `<tr>
          <td>${esc(c)} ${esc(n)}</td>
          <td style="text-align:center;"><b>${byModel[k]}</b></td>
          <td><input type="number" class="st-count" data-k="${esc(k)}" data-sys="${byModel[k]}" value="${byModel[k]}" style="width:70px;direction:ltr;" oninput="stUpdate(this)"></td>
          <td class="st-diff" data-k="${esc(k)}" style="text-align:center;">0</td>
        </tr>`;
      }).join("")}
      </tbody>
    </table></div>
    <div class="field" style="margin-top:10px;"><label>توضیحات انبارگردانی</label><input id="st_note" placeholder="مثلاً: انبارگردانی پایان فصل"></div>`;
  openModal("📋 انبارگردانی", html, () => {
    const diffs = [];
    document.querySelectorAll(".st-count").forEach(inp => {
      const sys = Number(inp.dataset.sys), cnt = Number(inp.value) || 0;
      if (sys !== cnt) diffs.push({ k: inp.dataset.k, sys, cnt, diff: cnt - sys });
    });
    const note = $("st_note").value.trim() || "انبارگردانی";
    const rec = { id: uid("st"), at: new Date().toISOString(), date: todayJalali(), branch: activeBranch, by: userTag(), note, diffs };
    if (!DB.settings.stocktakes) DB.settings.stocktakes = [];
    DB.settings.stocktakes.unshift(rec);
    if (DB.settings.stocktakes.length > 200) DB.settings.stocktakes.length = 200;

function stUpdate(inp) {

  if (cell) { cell.textContent = d > 0 ? "+" + d : d; cell.style.color = d ? (d > 0 ? "#27ae60" : "#c0392b") : ""; cell.style.fontWeight = d ? "bold" : ""; }
}

/* ============================ ۵) حداقل/حداکثر هر مدل ============================ */
function modelKey(it) { return (it.company || "") + "|" + (it.name || ""); }
function modelLimits() {
  if (!DB.settings.modelLimits) DB.settings.modelLimits = {};
  return DB.settings.modelLimits;
}
function allModelKeys() {
  const set = new Set();
  activeItems().forEach(i => { if (i.name) set.add(modelKey(i)); });
  Object.keys(modelLimits()).forEach(k => set.add(k));
  return [...set].sort();
}
function modelStock(key, branch) {
  const b = branch || activeBranch;
  return DB.items.filter(i => !itemDeleted(i) && !itemArchived(i) &&
    (i.status === STATUS.IN || i.status === STATUS.RESERVED) && modelKey(i) === key &&
    (b === MANAGER || i.branch === b)).length;
}
function renderModelLimits() {
  const el = $("modelLimitManage"); if (!el) return;
  if (!canManage()) { el.innerHTML = ""; return; }
  const lim = modelLimits();
  const keys = allModelKeys();
  if (!keys.length) { el.innerHTML = '<div class="empty">مدلی ثبت نشده</div>'; return; }
  el.innerHTML = `<div style="max-height:340px;overflow:auto;"><table style="width:100%;font-size:13px;">
    <thead><tr><th style="text-align:right;">مدل</th><th>موجودی</th><th>حداقل</th><th>حداکثر</th></tr></thead>
    <tbody>${keys.map(k => {
      const [c, n] = k.split("|");
      const l = lim[k] || { min: 0, max: 0 };
      const stock = modelStock(k);
      const warn = l.min && stock <= l.min;
      return `<tr>
        <td>${esc(c)} ${esc(n)} ${warn ? '⚠️' : ""}</td>
        <td style="text-align:center;">${stock}</td>
        <td><input type="number" min="0" value="${l.min || 0}" style="width:70px;direction:ltr;" onchange="setModelLimit('${esc(k)}','min',this.value)"></td>
        <td><input type="number" min="0" value="${l.max || 0}" style="width:70px;direction:ltr;" onchange="setModelLimit('${esc(k)}','max',this.value)"></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}
function setModelLimit(key, which, val) {
  const lim = modelLimits();
  lim[key] = lim[key] || { min: 0, max: 0 };
  lim[key][which] = Number(val) || 0;
  save(); renderModelLimits();
  toast("✅ ذخیره شد");
}
function reorderSuggestions() {
  const lim = modelLimits();
  const out = [];
  for (const k in lim) {
    const l = lim[k];
    if (!l.min) continue;
    const stock = modelStock(k);
    if (stock <= l.min) {
      const [c, n] = k.split("|");
      out.push({ model: `${c} ${n}`, stock, min: l.min, suggest: Math.max(1, l.min - stock) });
    }
  }
  return out;
}
function showReorderSuggestions() {
  const list = reorderSuggestions();
  if (!list.length) { toast("همه مدل‌ها بالای حد مجاز هستند ✅"); return; }
  const html = `<p class="helper">مدل‌هایی که به حداقل رسیده‌اند و پیشنهاد سفارش:</p>
    <table style="width:100%;font-size:13px;">
      <thead><tr><th style="text-align:right;">مدل</th><th>موجودی</th><th>حداقل</th><th>پیشنهاد سفارش</th></tr></thead>
      <tbody>${list.map(x => `<tr><td>${esc(x.model)}</td><td style="text-align:center;color:#c0392b;font-weight:bold;">${x.stock}</td><td style="text-align:center;">${x.min}</td><td style="text-align:center;color:#27ae60;font-weight:bold;">${x.suggest}</td></tr>`).join("")}</tbody>
    </table>`;
  openModal("🛒 پیشنهاد سفارش", html, null, "بستن");
}

/* ============================ ۶) کاردکس (دفتر حرکت) ============================ */
function buildKardex(branch) {
  const scope = isManager() ? DB.items : DB.items.filter(i => i.branch === activeBranch);
  const rows = [];
  const actionMap = {
    in: "ورود به انبار", sale: "فروش", transfer: "انتقال بین شعبه", return: "برگشت از مشتری",
    status: "تغییر وضعیت", exit: "خروج از انبار", adjust: "اصلاح موجودی", archive: "آرشیو",
    restore: "بازگردانی", supplier_return: "برگشت به تامین‌کننده", reserve: "رزرو"
  };
  DB.history.forEach(h => {
    const it = DB.items.find(i => i.id === h.itemId);
    if (!it) return;
    if (!isManager() && it.branch !== activeBranch && h.branch !== activeBranch) return;
    if (h.action === "stocktake" || h.action === "po_receive") return;
    rows.push({
      date: h.date, createdAt: h.createdAt, itemId: h.itemId,
      branch: h.branch || it.branch,
      model: `${it.company || ""} ${it.name || ""}`.trim(),
      chassis: it.chassis, plate: it.plate,
      movement: actionMap[h.action] || h.action,
      from: h.fromStatus, to: h.toStatus,
      note: h.note, by: h.by
    });
  });
  rows.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
  return rows;
}
function renderKardex() {
  const q = ($("kx_q") ? $("kx_q").value : "").trim().toLowerCase();
  let rows = buildKardex();
  if (q) rows = rows.filter(r => [r.model, r.chassis, r.plate, r.movement, r.note, r.by].join(" ").toLowerCase().includes(q));
  const totalCount = rows.length;
  const pg = paginate(rows, "kx");
  rows = pg.pageRows;
  if ($("kxCount")) $("kxCount").textContent = `${totalCount} حرکت — صفحه ${pg.cur} از ${pg.pages}`;
  const el = $("kxTable"); if (!el) return;
  if (!totalCount) { el.innerHTML = '<div class="empty">حرکتی یافت نشد</div>'; return; }
  el.innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr><th>تاریخ</th><th>شعبه</th><th>مدل</th><th>شاسی/پلاک</th><th>حرکت</th><th>از→به</th><th>کاربر</th><th>توضیح</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.date) || "-"}</td>
      <td>${esc(r.branch) || "-"}</td>
      <td>${esc(r.model)}</td>
      <td><span style="font-size:10px;direction:ltr;">${esc(r.chassis) || "-"}</span> / <span style="direction:ltr;">${esc(r.plate) || "-"}</span></td>
      <td>${esc(r.movement)}</td>
      <td>${esc(r.from) || "-"} → ${esc(r.to) || "-"}</td>
      <td>${esc(r.by) || "-"}</td>
      <td style="font-size:12px;">${esc(r.note) || ""}</td>
    </tr>`).join("")}</tbody></table></div>` + pg.bar;

const AUTH_KEY = "moto_warehouse_auth";

/* ---------- ورود / راه‌اندازی ---------- */
function showLogin() {
  $("loginScreen").classList.remove("hidden");
  $("setupBlock").style.display = DB.users.length ? "none" : "block";
  $("loginSub").textContent = DB.users.length
    ? "نام کاربری و رمز عبور خود را وارد کنید"

async function doSetupManager() {
  const u = $("setup_user").value.trim() || "manager";
  const p = $("setup_pass").value;
  const p2 = $("setup_pass2").value;
  const errEl = $("loginErr");
  if (p.length < 6) { errEl.textContent = "رمز عبور باید حداقل ۶ کاراکتر باشد"; return; }
  if (p !== p2) { errEl.textContent = "رمز عبور و تکرار آن یکسان نیست"; return; }
  errEl.textContent = "";

  const phrase = generateRecoveryPhrase(12);
  const newUser = await createUser(u, p, "manager", MANAGER, { recovery: phrase });
  await unlockWithPassword(newUser, p);
  await persistSessionKey();
  currentUser = { username: u, role: "manager", branch: MANAGER };
  sessionStorage.setItem(AUTH_KEY, JSON.stringify({ username: u, role: "manager", branch: MANAGER }));
  save({ users: [u] });
  // نمایش اجباری عبارت بازیابی
  showRecoveryPhrase(phrase, () => { preDecryptAll().then(startApp); toast("🛡️ حساب مدیر ساخته شد"); });
}

/* نمایش عبارت بازیابی با تایید اجباری */
function showRecoveryPhrase(phrase, onDone) {
  const words = phrase.split(" ");
  const html = `
    <div class="alert red" style="margin-bottom:10px;">⚠️ این عبارت <b>فقط یک بار</b> نمایش داده می‌شود. آن را روی کاغذ بنویسید و در جای امن (گاوصندوق) نگه دارید.</div>
    <div style="background:#f8fafd;border:2px dashed #2a5298;border-radius:10px;padding:14px;text-align:center;font-size:16px;font-weight:700;line-height:2.2;letter-spacing:.3px;">
      ${words.map((w, i) => `<span style="display:inline-block;margin:3px 6px;background:#fff;border-radius:6px;padding:3px 10px;">${i + 1}. ${esc(w)}</span>`).join("")}
    </div>
    <div style="margin-top:14px;">
      <button class="btn gray" onclick="copyRecovery('${esc(phrase)}')">📋 کپی</button>
      <button class="btn gray" onclick="downloadRecovery('${esc(phrase)}')">⬇️ ذخیره فایل</button>
    </div>
    <div class="field" style="margin-top:14px;">
      <label>برای اطمینان، سه کلمه اول عبارت را اینجا بنویسید</label>
      <input id="rec_check" placeholder="کلمه۱ کلمه۲ کلمه۳">
    </div>
    <div id="rec_err" class="login-err"></div>`;
  openModal("🔑 عبارت بازیابی شما", html, () => {
    const got = normalizePhrase($("rec_check").value);
    const want = words.slice(0, 3).join(" ");
    if (got !== want) { $("rec_err").textContent = "کلمات مطابق نیست. دوباره بنویسید."; return; }
    closeModal(); if (onDone) onDone();
  }, "تایید و ورود");
}
function copyRecovery(phrase) {
  navigator.clipboard?.writeText(phrase).then(() => toast("📋 کپی شد")).catch(() => toast("کپی نشد — دستی یادداشت کنید", false));
}
function downloadRecovery(phrase) {
  const txt = `عبارت بازیابی انبارداری چندشعبه‌ای\nتاریخ: ${todayJalali()}\n\n${phrase}\n\nاین عبارت را در جای امن نگه دارید. با آن می‌توانید در صورت فراموشی رمز، دسترسی و داده‌های رمزنگاری‌شده را بازیابید.`;
  const blob = new Blob(["\uFEFF" + txt], { type: "text/plain;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `moto-recovery-${todayJalali().replace(/\//g, "-")}.txt`;
  a.click();
  toast("⬇️ ذخیره شد");
}

async function doLogin() {
  const u = $("login_user").value.trim();
  const p = $("login_pass").value;
  const errEl = $("loginErr");
  if (!u || !p) { errEl.textContent = "نام کاربری و رمز عبور را وارد کنید"; return; }
  const user = await verifyUser(u, p);
  if (!user) { errEl.textContent = "نام کاربری یا رمز عبور اشتباه است"; return; }
  if (isUserDisabled(u)) { errEl.textContent = "این حساب توسط مدیر غیرفعال شده است"; return; }
  errEl.textContent = "";
  // باز کردن کلید داده
  if (user.wrappedKeyPass) {
    try { await unlockWithPassword(user, p); await persistSessionKey(); }
    catch (e) { errEl.textContent = "خطا در باز کردن کلید داده"; return; }
  }
  currentUser = { username: user.username, role: user.role, branch: user.branch };
  sessionStorage.setItem(AUTH_KEY, JSON.stringify(currentUser));
  await preDecryptAll();
  startApp();
  toast(`👋 خوش آمدید ${user.username}`);
}

function openForgotPassword() {
  const mgr = DB.users.find(x => x.role === "manager");
  const html = `

async function restoreSessionKey() {

async function changePassword() {
  const oldp = prompt("رمز فعلی را وارد کنید:");
  if (!oldp) return;
  const me = await verifyUser(currentUser.username, oldp);
  if (!me) { toast("رمز فعلی اشتباه است", false); return; }
  const np = prompt("رمز جدید (حداقل ۶ کاراکتر):");
  if (!np || np.length < 6) { toast("رمز جدید نامعتبر", false); return; }
  try {
    if (me.wrappedKeyPass) {
      await unlockWithPassword(me, oldp);                     // باز کردن کلید داده
      await rewrapForNewPassword(me, np);                     // بسته‌بندی مجدد با رمز جدید
    } else {
      // کاربر قدیمی: هش salt-دار بساز
      const salt = bytesToB64(randBytes(16));
      me.salt = salt;
      me.passHash = bytesToB64(await pbkdf2(np, b64ToBytes(salt), "auth"));
    }
    await persistSessionKey();
    save({ users: [me.username] }); toast("✅ رمز تغییر کرد");
  } catch (e) { toast("تغییر رمز ممکن نشد", false); }
}

/* ---------- همگام‌سازی زنده ---------- */
let syncWS = null, syncRoom = null, syncConnected = false, syncApplying = false;

function setSyncBadge(state, text) {
  const el = $("syncBadge"); if (!el) return;
  el.className = "stats " + (state === "on" ? "online" : state === "off" ? "offline" : "");
  el.textContent = text;
}
function startSync(room) {
  if (!room || !window.WebSocket) { setSyncBadge("off", "⚪ تک‌دستگاه"); return; }
  try {
    syncRoom = room;
    const url = `wss://${location.host}/ws/${room}`;
    syncWS = new WebSocket(url);
    syncWS.onopen = () => {
      syncConnected = true;
      setSyncBadge("on", "🟢 متصل (همگام)");
    };
    syncWS.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "welcome" && m.state && m.state.db) {
        // داده مشترک اتاق را اگر جدیدتر است اعمال کن
        if (!DB.settings.lastSaved || (m.state.db.settings.lastSaved || "") > DB.settings.lastSaved) {
          syncApplying = true;
          DB = m.state.db;
          localStorage.setItem(LS_KEY, JSON.stringify(DB));
          renderBranchTabs(); renderDashboard();
          const t = document.querySelector("#mainNav button.active");
          if (t) refreshTab(t.dataset.tab);
          syncApplying = false;
        }
      }
      if (m.type === "msg" && m.data && m.data.kind === "db") {
        if (!DB.settings.lastSaved || (m.data.db.settings.lastSaved || "") > DB.settings.lastSaved) {
          syncApplying = true;
          DB = m.data.db;
          localStorage.setItem(LS_KEY, JSON.stringify(DB));
          renderBranchTabs(); renderDashboard();
          const t = document.querySelector("#mainNav button.active");
          if (t) refreshTab(t.dataset.tab);
          syncApplying = false;
          toast("🔄 داده از کاربر دیگر به‌روز شد");
        }
      }
      if (m.type === "join") { /* peer joined */ }
    };
    syncWS.onclose = () => { syncConnected = false; setSyncBadge("off", "🔴 قطع شد"); setTimeout(() => { if (syncRoom) startSync(syncRoom); }, 4000); };
    syncWS.onerror = () => setSyncBadge("off", "🔴 خطای اتصال");
  } catch (e) { setSyncBadge("off", "⚪ تک‌دستگاه"); }
}
function disconnectSync() {
  syncRoom = null;
  if (syncWS) { try { syncWS.close(); } catch (e) {} syncWS = null; }
  setSyncBadge("off", "⚪ آفلاین");
}
function broadcastDB() {
  if (!syncConnected || syncApplying) return;
  try { syncWS.send(JSON.stringify({ type: "msg", data: { kind: "db", db: DB } })); } catch (e) {}
}

/* ---------- بارگذاری اولیه از سرور ---------- */
async function supaLoadAll() {
  // تنظیمات
  const s = await supaFetch("settings?select=*&id=eq.main");
  if (s && s[0] && s[0].data && Object.keys(s[0].data).length) {
    DB.settings = Object.assign({}, DEFAULT_SETTINGS, s[0].data);
    if (Array.isArray(s[0].data.companies) && s[0].data.companies.length) DB.companies = s[0].data.companies;
  }
  // کاربران
  const us = await supaFetch("app_users?select=*");
  if (us) {
    DB.users = us.map(u => ({
      username: u.username, salt: u.salt, passHash: u.pass_hash,
      role: u.role, branch: u.branch,
      wrappedKeyPass: u.wrapped_key_pass,
      wrappedKeyRecovery: u.wrapped_key_recovery,
      recoveryHint: u.recovery_hint, createdAt: u.created_at
    }));
  }
  // آیتم‌ها (صفحه‌بندی برای پشتیبانی از بیش از ۱۰۰۰ ردیف)
  const allItems = [];
  for (let from = 0; ; from += 1000) {
    const page = await supaFetch(`items?select=*&order=updated_at.asc&offset=${from}&limit=1000`);
    if (!page || !page.length) break;
    allItems.push(...page);
    if (page.length < 1000) break;
  }
  DB.items = allItems.map(rowToItem);
  // تاریخچه (همیشه حفظ می‌شود — هیچ‌وقت پاک نمی‌شود) — صفحه‌بندی کامل
  const allHist = [];
  for (let from = 0; ; from += 1000) {
    const page = await supaFetch(`history?select=*&order=created_at.asc&offset=${from}&limit=1000`);
    if (!page || !page.length) break;
    allHist.push(...page);
    if (page.length < 1000) break;
  }
  DB.history = allHist.map(rowToHistory);
  // گروه‌های موجودی
  try {
    const grp = await supaFetch("groups?select=*&order=sort_order.asc");

/* تاریخچه فقط append می‌شود — هرگز حذف/جایگزین نمی‌شود */

/* ---------- صف ارسال (debounce) ---------- */
const _dirtyItems = new Set();
const _dirtyUsers = new Set();
let _dirtySettings = false;
const _pendingActivity = [];

function markItemDirty(id) {
  const it = DB.items.find(i => i.id === id);
  if (it) it.updatedAt = new Date().toISOString();
  _dirtyItems.add(id);
  scheduleSupaPush();
}
function markUserDirty(username, isNew) {
  _dirtyUsers.add(username);
  if (isNew) _newUsers.add(username);
  scheduleSupaPush();
}
const _newUsers = new Set();
function markSettingsDirty() { _dirtySettings = true; scheduleSupaPush(); }
function markDeletedItem(id) { _deletedItems.add(id); scheduleSupaPush(); }
function markDeletedUser(username) { _deletedUsers.add(username); scheduleSupaPush(); }
const _deletedItems = new Set();
const _deletedUsers = new Set();

function scheduleSupaPush() {
  if (!SUPA_ON) return;
  // اگر آفلاین هستیم، علامت‌گذاری می‌کنیم تا هنگام بازگشت آنلاین ارسال شود
  if (!supaOnline) { _needsResync = true; return; }
  clearTimeout(_supaPushTimer);
  _supaPushTimer = setTimeout(supaFlush, 400);
}
let _needsResync = false;
async function supaFlush() {
  if (!SUPA_ON || !supaOnline) return;
  try {
    // موتورهای تغییر‌یافته + موتورهای حذف‌نرم‌شده (هر دو upsert می‌شوند، هرگز حذف نمی‌شوند)
    const dirtyIds = new Set([..._dirtyItems, ..._deletedItems]);
    const itemRows = DB.items.filter(i => dirtyIds.has(i.id));
    if (itemRows.length) {
      await supaUpsertItems(itemRows);
      // فقط پس از موفقیت، پاک کن (اگر شکست خورد، برای تلاش مجدد بماند)
      dirtyIds.forEach(id => { _dirtyItems.delete(id); _deletedItems.delete(id); });
    }

    const userRows = DB.users.filter(u => _dirtyUsers.has(u.username));
    if (userRows.length) {
      await supaUpsertUsers(userRows);
      userRows.forEach(u => _dirtyUsers.delete(u.username));
    }

    if (_dirtySettings) {
      await supaPushSettings();
      _dirtySettings = false;
    }

    if (typeof _pendingHistory !== "undefined" && _pendingHistory.length) {
      const h = _pendingHistory.slice();
      await supaPushHistory(h);
      _pendingHistory.splice(0, h.length);
    }

    if (_pendingActivity.length) {
      const a = _pendingActivity.slice();
      await supaPushActivity(a);
      _pendingActivity.splice(0, a.length);
    }
  } catch (e) {
    console.warn("supaFlush", e);
    setServerBadge("off", "🔴 خطای ذخیره — تلاش مجدد...");
    // تلاش مجدد خودکار پس از ۳ ثانیه (داده در صف می‌ماند)
    clearTimeout(_supaRetryTimer);
    _supaRetryTimer = setTimeout(() => { if (supaOnline) supaFlush(); }, 3000);
  }
}

/* ---------- کشیدن تغییرات دیگران (polling) ---------- */
async function supaPullChanges() {
  if (!SUPA_ON || !supaOnline) return;
  try {
    const items = await supaFetch("items?select=*&order=updated_at.desc&limit=1000");
    if (!items) return;
    let changed = false;
    // آیتم‌های جدید/به‌روزشده — هیچ رکوردی هرگز حذف نمی‌شود (حذف نرم)
    for (const r of items) {
      const local = DB.items.find(i => i.id === r.id);
      if (!local) { DB.items.push(rowToItem(r)); changed = true; }
      else if (!_dirtyItems.has(r.id) && (r.updated_at || "") > (local.updatedAt || "")) {
        Object.assign(local, rowToItem(r));
        changed = true;
      }
    }
    // هیچ حذف خودکاری انجام نمی‌شود؛ داده‌ها همیشه روی سرور می‌مانند.

    // تنظیمات مشترک: ادغام ایمن (approvals/POs/stocktakes از دو شعبه گم نشوند)
    if (!_dirtySettings) {
      try {
        const s = await supaFetch("settings?select=*&id=eq.main");
        if (s && s[0] && s[0].data) {
          const remote = s[0].data;
          const merged = mergeSettings(DB.settings, remote);
          if (JSON.stringify(merged) !== JSON.stringify(DB.settings)) {
            DB.settings = merged;
            changed = true;
          }
        }
      } catch (e) { /* ignore */ }
    }

    if (changed) {
      try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
      if (typeof preDecryptAll === "function") await preDecryptAll();
      renderBranchTabs(); renderDashboard();
      const t = document.querySelector("#mainNav button.active");
      if (t) refreshTab(t.dataset.tab);
    }
  } catch (e) { console.warn("supaPull", e); }
}
/* ادغام تنظیمات محلی و سرور بدون گم شدن داده‌های مشترک */
function mergeSettings(local, remote) {
  const out = Object.assign({}, remote, local);
  // لیست‌هایی که چند شعبه همزمان اضافه می‌کنند → اتحاد (بدون گم شدن)
  const unionBy = (a, b, keyFn) => {
    const map = new Map();
    (b || []).forEach(x => map.set(keyFn(x), x));
    (a || []).forEach(x => map.set(keyFn(x), x));
    return [...map.values()];
  };
  out.pendingEdits = unionBy(local.pendingEdits, remote.pendingEdits, r => r.id);
  out.purchaseOrders = unionBy(local.purchaseOrders, remote.purchaseOrders, r => r.id);
  out.stocktakes = unionBy(local.stocktakes, remote.stocktakes, r => r.id).sort((x, y) => String(y.at || "").localeCompare(String(x.at || ""))).slice(0, 200);
  out.disabledUsers = [...new Set([...(local.disabledUsers || []), ...(remote.disabledUsers || [])])];
  out.suppliers = [...new Set([...(local.suppliers || []), ...(remote.suppliers || [])])];
  out.modelLimits = Object.assign({}, remote.modelLimits || {}, local.modelLimits || {});
  return out;
}
function startServerSync() {
  if (!SUPA_ON) { setServerBadge("off", "⚪ آفلاین"); return; }
  clearInterval(_supaPullTimer);
  _supaPullTimer = setInterval(supaPullChanges, 5000);
  // تلاش برای اتصال مجدد و ارسال صف در صورت قطعی
  clearInterval(_supaReconnectTimer);
  _supaReconnectTimer = setInterval(() => {
    if (!supaOnline) {
      supaInit().then(ok => { if (ok) { if (_needsResync) { _needsResync = false; supaFlush(); } supaPullChanges(); } });
    } else if (_needsResync) {
      _needsResync = false; supaFlush();
    }
  }, 10000);
}
let _supaReconnectTimer = null;

  DB.settings.companyName = name; DB.settings.lowStock = low; DB.settings.branches = [...new Set(bs)];
  if (!DB.settings.branches.includes(activeBranch)) activeBranch = DB.settings.branches[0];
  save(); renderBranchTabs(); renderSettings(); toast("✅ تنظیمات ذخیره شد");
}
function renameBranch(old) {
  openModal("تغییر نام شعبه", `<div class="field"><label>نام جدید</label><input id="rb_name" value="${esc(old)}"></div>`, () => {
    const nn = $("rb_name").value.trim();
    if (!nn) return;
    const idx = DB.settings.branches.indexOf(old);
    if (idx >= 0) DB.settings.branches[idx] = nn;
    DB.items.forEach(i => { if (i.branch === old) i.branch = nn; });
    if (activeBranch === old) activeBranch = nn;
    save(); closeModal(); renderBranchTabs(); renderSettings(); toast("✅ نام شعبه تغییر کرد");
  }, "ذخیره", () => { const i = $("rb_name"); if (i) i.focus(); });
}
function removeBranch(b) {
  const used = DB.items.some(i => i.branch === b);
  if (used) { toast("این شعبه دارای داده است", false); return; }
  openModal("حذف شعبه", `شعبه <b>${esc(b)}</b> حذف شود؟`, () => {
    DB.settings.branches = DB.settings.branches.filter(x => x !== b);
    if (activeBranch === b) activeBranch = DB.settings.branches[0];
    save(); closeModal(); renderBranchTabs(); renderSettings(); toast("🗑️ حذف شد");
  }, "حذف");
}

/* ==========================================================================
   پشتیبان
   ========================================================================== */
function exportData() {
  if (!canManage()) { toast("فقط مدیر می‌تواند پشتیبان کامل بگیرد", false); return; }
  downloadJSON(`moto-backup-${todayJalali().replace(/\//g, "-")}.json`, DB);
  logActivity("پشتیبان‌گیری", "دانلود فایل پشتیبان");
  save(); toast("✅ فایل پشتیبان دانلود شد");
}
function exportAllCSV() {
  if (!canManage()) { toast("فقط مدیر", false); return; }
  const zip = [];
  zip.push("=== موتورها ===");
  zip.push(toCSV([["شعبه", "شرکت", "نام", "شاسی", "پلاک", "قیمت خرید", "قیمت فروش", "وضعیت", "تاریخ ورود", "خریدار"],
    ...DB.items.map(i => [i.branch, i.company, i.name, i.chassis, i.plate, i.price, (i.saleInfo && i.saleInfo.salePrice) || "", i.status, i.dateIn, (i.saleInfo && i.saleInfo.buyer) || ""])]));
  zip.push("\n=== تاریخچه ===");
  zip.push(toCSV([["تاریخ", "شعبه", "از", "به", "توضیح"],
    ...DB.history.map(h => [h.date, h.branch, h.fromStatus || "", h.toStatus || "", h.note])]));
  const blob = new Blob(["\uFEFF" + zip.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `moto-alldata-${todayJalali().replace(/\//g, "-")}.csv`;
  a.click();
  toast("✅ دانلود شد");
}
function importData(ev) {
  if (!canManage()) { toast("فقط مدیر", false); ev.target.value = ""; return; }
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.items || !d.history) throw new Error("bad");
      openModal("بازگردانی (ادغام امن)", `فایل شامل <b>${d.items.length}</b> موتور است.<br><br>موتورهای جدید <b>اضافه</b> می‌شوند؛ هیچ داده فعلی پاک نمی‌شود و تاریخچه‌ها ادغام می‌گردند. ادامه؟`, () => {
        const byId = new Map(DB.items.map(i => [i.id, i]));
        (d.items || []).forEach(it => { if (!byId.has(it.id)) DB.items.push(it); });
        const hIds = new Set(DB.history.map(h => h.id));
        (d.history || []).forEach(h => { if (!hIds.has(h.id)) DB.history.push(h); });
        if (d.users && d.users.length) {
          const uIds = new Set(DB.users.map(u => u.username));
          d.users.forEach(u => { if (!uIds.has(u.username)) DB.users.push(u); });
        }
        save({ items: (d.items || []).map(i => i.id) });
        closeModal(); toast("✅ بازگردانی و ادغام شد (بدون حذف)");
        renderBranchTabs(); renderDashboard(); renderInventory(); renderCycle();
      }, "ادغام کن");
    } catch (err) { toast("❌ فایل نامعتبر است", false); }
    ev.target.value = "";
  };
  r.readAsText(f);
}
function resetAll() {
  openModal("⚠️ آرشیو کردن همه داده‌ها", "همه موتورهای فعال <b>به بایگانی منتقل</b> می‌شوند (پاک نمی‌شوند).<br><br>✅ همه اطلاعات، مشخصات و تاریخچه روی سرور محفوظ می‌ماند و از تب «بایگانی» قابل بازگردانی است.", async () => {
    let n = 0;
    for (const it of DB.items) {
      if (!it.deleted && !it.archived) {
        it.archived = true; it.archivedAt = new Date().toISOString();
        if (typeof markItemDirty === "function") markItemDirty(it.id);
        n++;
      }
    }
    pushHistory({ itemId: null, branch: MANAGER, action: "archive", fromStatus: null, toStatus: null, date: todayJalali(), note: `آرشیو گروهی ${n} موتور توسط ${userTag()}`, by: userTag() });
    save(); closeModal(); toast(`📦 ${n} موتور آرشیو شد (قابل بازگردانی)`);
    renderBranchTabs(); renderDashboard(); renderInventory(); renderCycle();
  }, "آرشیو کن");
}
function renderStorageInfo() {
  const bytes = new Blob([JSON.stringify(DB)]).size;
  const kb = (bytes / 1024).toFixed(1);
  const fsStatus = fileHandle ? "✅ متصل — ذخیره خودکار فعال" : "⚠️ متصل نیست — داده فقط در مرورگر";
  $("storageInfo").innerHTML = `<div class="kpi-mini">
    <div><b>${DB.items.length}</b>موتور</div>
    <div><b>${DB.history.length}</b>رخداد</div>
    <div><b>${DB.activity.length}</b>فعالیت</div>
    <div><b>${kb} KB</b>حجم داده</div>
    <div style="grid-column:1/-1;"><b>${fsStatus}</b>وضعیت فایل امن</div></div>`;
}
function loadDemo() {
  openModal("داده نمونه", "داده‌های نمایشی به انبار اضافه شود؟ (داده‌های فعلی حفظ می‌شوند)", () => {
    closeModal(); seedDemo(); toast("✅ داده نمونه اضافه شد");
    renderBranchTabs(); renderDashboard(); save();
  }, "افزودن");
}

  const names = ["CGL 125", "دینو ۲۰۰", "پالس ۲۰۰", "آریا ۱۵۰"];

  branches().slice(0, 3).forEach((b, bi) => {
    for (let i = 0; i < 3; i++) {
      const chassis = `DEMO${bi}${i}${Math.floor(Math.random() * 9000 + 1000)}`;
      DB.items.push({

        name: names[(bi + i) % names.length], volume: "125cc", type: "اسپرت",
        color: colors[i % colors.length], year: "1402", chassis, engine: "",
        plate: "", plateSerial: "", price: 300000000 + i * 20000000,
        payStatus: "نقدی", specs: "", note: "داده نمونه", supplier: "نمایشی",
        supplierPhone: "", barname: "DEMO-" + i, receiver: "مدیر", dateIn: todayJalali(),
        status: STATUS.IN, saleInfo: null, exitInfo: null, warranty: null, createdAt: new Date().toISOString()
      });

/* ==========================================================================
   میان‌برها
   ========================================================================== */
function openShortcuts() {
  openModal("⌨️ میان‌برهای صفحه‌کلید", `
    <div class="info-grid" style="grid-template-columns:1fr;">
      <div><b>Ctrl + S</b> — ذخیره داده‌ها</div>
      <div><b>Ctrl + P</b> — چاپ صفحه فعلی</div>
      <div><b>Ctrl + Enter</b> — تایید مودال باز</div>
      <div><b>Esc</b> — بستن مودال</div>
      <div><b>Alt + 1..9</b> — جابه‌جایی سریع بین تب‌ها</div>
    </div>`, null);
}
const TAB_ORDER = ["dash", "in", "out", "cycle", "inv", "report", "log", "settings", "backup"];
document.addEventListener("keydown", e => {
  if (e.altKey && !e.ctrlKey) {
    const n = parseInt(e.key);
    if (n >= 1 && n <= TAB_ORDER.length) {
      const b = document.querySelector(`#mainNav button[data-tab="${TAB_ORDER[n - 1]}"]`);
      if (b) { e.preventDefault(); b.click(); }
    }
  }
  if (e.ctrlKey && e.key === "Enter") {
    const activeTab = document.querySelector("#mainNav button.active").dataset.tab;
    if (activeTab === "in") { e.preventDefault(); addEntry(); }
    if (activeTab === "out") { e.preventDefault(); addExit(); }
  }
});

/* ==========================================================================
   فرم‌ها: پاک کردن
   ========================================================================== */
function clearForm(prefix) {
  const ids = {
    in: ["in_barname", "in_supplier", "in_supplier_phone", "in_receiver", "in_company", "in_name", "in_volume", "in_type", "in_color", "in_year", "in_chassis", "in_engine", "in_plate", "in_plateSerial", "in_price", "in_prepay", "in_specs", "in_note"],
    out: ["out_receipt", "out_buyer", "out_father", "out_national", "out_birth", "out_phone", "out_price", "out_discount", "out_tradeIn", "out_address", "out_note", "out_itemSearch"]
  };
  (ids[prefix] || []).forEach(id => { const el = $(id); if (el) { el.value = ""; el.dataset.raw = ""; } });
  if (prefix === "in") { $("in_qty").value = 1; $("in_date").value = todayJalali(); }
  if (prefix === "out") { $("out_date").value = todayJalali(); $("out_item").selectedIndex = 0; }
  clearErrs(prefix === "in" ? $("inForm") : $("outForm"));
}

/* ==========================================================================
   راه‌اندازی
   ========================================================================== */
function bindLiveInputs() {
  const live = (id, fn) => { const el = $(id); if (el) el.addEventListener("input", fn); };
  live("inv_q", renderInventory);
  live("inv_status", renderInventory);
  live("inv_company", renderInventory);
  live("inv_sort", renderInventory);
  live("cyc_q", renderCycle);
  live("cyc_status", renderCycle);
  live("log_q", renderLog);
}

async function boot() {
  load();
  applyTheme();
  buildPanels();
  buildForms();
  setupNav();
  bindLiveInputs();
  attachNumFmt(document);
  document.querySelectorAll(".dp-input").forEach(buildJalaliPicker);
  // فیلدهایی که ورود دستی هم دارند
  if ($("out_birth")) attachManualDate($("out_birth"));
  if ($("out_date")) attachManualDate($("out_date"));

  $("in_date").value = todayJalali();
  $("out_date").value = todayJalali();

  toggleOutType();
  populateDatalists();
  renderBranchTabs();
  renderDashboard();

  await initFileStorage();

  // ذخیره خودکار قبل از بستن
  window.addEventListener("beforeunload", save);

  // کنترل ورود
  bootAuth();

  $("login_pass") && $("login_pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("setup_pass2") && $("setup_pass2").addEventListener("keydown", e => { if (e.key === "Enter") doSetupManager(); });
}
boot();
</script>
